function chatIdFor(a,b){return[a,b].sort().join('__')}

$('newGroupBtn').onclick=()=>{
  let groupMembers=[];
  openModal(`<div class="modal-head"><div class="modal-title">Новая группа</div><button class="modal-close">×</button></div><div class="modal-body">
    <div class="field"><input type="text" id="groupName" placeholder="Название группы" maxlength="60"></div>
    <div class="admin-section" style="margin-top:8px">
      <h4 style="font-size:13px">👥 Участники</h4>
      <input type="text" class="admin-input" id="groupSearch" placeholder="@username" autocomplete="off">
      <div id="groupSuggest"></div>
      <div id="groupList" style="margin-top:6px"></div>
    </div>
    <button class="btn-primary" id="createGroupBtn" style="margin-top:14px">Создать</button>
  </div>`);
  const gs=$('groupSearch'),sug=$('groupSuggest'),lst=$('groupList');
  function render(){
    lst.innerHTML=groupMembers.map(u=>`<span class="coauthor-pill">@${esc(u.username)} <span class="rm" data-rmg="${esc(u.uid)}">×</span></span>`).join('');
    lst.querySelectorAll('[data-rmg]').forEach(b=>b.onclick=()=>{groupMembers=groupMembers.filter(x=>x.uid!==b.dataset.rmg);render()});
  }
  gs.oninput=()=>{
    const q=gs.value.trim().toLowerCase().replace(/^@+/,'');
    if(!q){sug.innerHTML='';return}
    const list=Object.values(usersCache).filter(u=>u.username&&u.uid!==cu.uid&&u.username.includes(q)&&!groupMembers.find(x=>x.uid===u.uid)).slice(0,5);
    sug.innerHTML=list.map(u=>`<div class="user-row" style="cursor:pointer" data-addg="${esc(u.uid)}">${avHTML(u,'sm')}<div class="user-row-info"><div class="user-row-name">${esc(u.name||'Без имени')}</div><div class="user-row-handle">@${esc(u.username)}</div></div></div>`).join('');
    sug.querySelectorAll('[data-addg]').forEach(el=>el.onclick=()=>{
      const u=usersCache[el.dataset.addg];if(!u)return;
      groupMembers.push({uid:u.uid,username:u.username});
      gs.value='';sug.innerHTML='';render();
    });
  };
  $('createGroupBtn').onclick=async()=>{
    const name=$('groupName').value.trim();
    if(!name)return toast('Введи название');
    if(!groupMembers.length)return toast('Добавь участников');
    try{
      const users=[cu.uid,...groupMembers.map(x=>x.uid)];
      const ref=await addDoc(collection(db,'chats'),{isGroup:true,groupName:name,users,createdAt:serverTimestamp(),createdBy:cu.uid,accepted:true,requestedBy:cu.uid,blocked:false,deletedBy:[],messageCount:0});
      for(const m of groupMembers){
        await sendNotif(m.uid,'group_invite','Приглашение в группу','@'+cu.username+' приглашает вас в группу "'+name+'"',{chatId:ref.id});
      }
      closeModal();toast('Группа создана');renderChatList();
    }catch(err){toast('Ошибка: '+err.message)}
  };
};

async function openOrCreateChat(otherUid){
  if(otherUid===cu.uid)return toast('Это ты');
  const cid=chatIdFor(cu.uid,otherUid);
  const cref=doc(db,'chats',cid);
  const snap=await getDoc(cref);
  if(!snap.exists()){
    if(!(cu.following||[]).includes(otherUid))return toast('Сначала подпишись');
    await setDoc(cref,{users:[cu.uid,otherUid],createdAt:serverTimestamp(),createdBy:cu.uid,accepted:false,requestedBy:cu.uid,blocked:false,deletedBy:[]});
  }else{
    const d=snap.data();
    if(d.blocked)return toast('Переписка заблокирована');
  }
  switchScr('chats');openChatView(cid,otherUid);
}

function closeChatView(){
  $('chatList').style.display='';$('chatView').style.display='none';$('chatView').innerHTML='';
  currentChatId=null;currentChatOther=null;currentChatIsGroup=false;
  if(unsubChats){unsubChats();unsubChats=null}
  if(unsubChatMeta){unsubChatMeta();unsubChatMeta=null}
}

async function renderChatList(){
  if(!cu)return;
  const cl=$('chatList');cl.style.display='';$('chatView').style.display='none';
  const q=query(collection(db,'chats'),where('users','array-contains',cu.uid));
  const snap=await getDocs(q);
  const chats=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!c.deletedBy||!c.deletedBy.includes(cu.uid)).sort((a,b)=>{
    const ta=a.lastAt?(a.lastAt.toMillis?a.lastAt.toMillis():a.lastAt):0;
    const tb=b.lastAt?(b.lastAt.toMillis?b.lastAt.toMillis():b.lastAt):0;
    return tb-ta;
  });
  
  if(!chats.length){cl.innerHTML=`<div class="chat-empty"><div class="empty-title">Чатов пока нет</div><div class="empty-text">Подпишись на кого-нибудь или создай группу</div></div>`;return}
  
  cl.innerHTML=chats.map(c=>{
    let ou,preview,dot;
    if(c.isGroup){
      ou={name:c.groupName||'Группа',avatar:null};
      preview=c.lastMsg||'Группа · '+(c.users||[]).length+' участников';
      dot=false;
    }else{
      const other=(c.users||[]).find(u=>u!==cu.uid);
      ou=usersCache[other]||{name:'?',username:'?'};
      preview=c.lastMsg||(c.accepted?'':'Запрос на переписку');
      dot=!c.accepted&&c.requestedBy!==cu.uid;
    }
    const avatarHtml=c.isGroup?`<div class="avatar sm group-avatar">👥</div>`:avHTML(ou,'sm');
    return `<div class="chat-item" data-chat="${c.id}">${avatarHtml}<div class="chat-item-info"><div class="chat-item-name">${esc(ou.name)}</div><div class="chat-item-preview">${esc(preview)}</div></div>${dot?'<div class="chat-item-badge">!</div>':''}<button class="chat-item-del" data-del-chat="${c.id}">🗑️</button></div>`;
  }).join('');
  
  cl.querySelectorAll('[data-chat]').forEach(el=>el.onclick=e=>{
    if(e.target.closest('[data-del-chat]'))return;
    const c=chats.find(x=>x.id===el.dataset.chat);
    const other=c.isGroup?null:(c.users||[]).find(u=>u!==cu.uid);
    openChatView(c.id,other,c.isGroup,c.groupName);
  });
  
  cl.querySelectorAll('[data-del-chat]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!confirm('Удалить чат?'))return;
    try{
      const cref=doc(db,'chats',b.dataset.delChat);
      const snap=await getDoc(cref);
      const d=snap.data();
      const deletedBy=d.deletedBy||[];
      if(!deletedBy.includes(cu.uid))deletedBy.push(cu.uid);
      await updateDoc(cref,{deletedBy});
      toast('Удалено');renderChatList();
    }catch(err){toast(err.message)}
  });
}

async function openChatView(cid,otherUid,isGroup,groupName){
  currentChatId=cid;currentChatOther=otherUid;currentChatIsGroup=!!isGroup;
  replyToMsg=null;
  $('chatList').style.display='none';
  const cv=$('chatView');cv.style.display='';
  const cref=doc(db,'chats',cid);
  const snap=await getDoc(cref);
  const data=snap.exists()?snap.data():{};
  
  let headerAvatar,headerName,headerSub;
  if(isGroup){
    headerAvatar=`<div class="avatar sm group-avatar">👥</div>`;
    headerName=groupName||'Группа';
    headerSub=(data.users||[]).length+' участников';
  }else{
    const ou=usersCache[otherUid]||{name:'?',username:'?'};
    headerAvatar=avHTML(ou,'sm');
    headerName=ou.name;
    headerSub='@'+ou.username;
  }
  
  const isRequestForMe=!isGroup&&!data.accepted&&data.requestedBy&&data.requestedBy!==cu.uid;
  const amIRequester=!isGroup&&!data.accepted&&data.requestedBy===cu.uid;
  const hasMessages=(data.messageCount||0)>0;
  
  cv.innerHTML=`
    <div class="chat-window">
      <div class="chat-header">
        <button class="back-btn" id="chatBack">←</button>
        ${headerAvatar}
        <div class="chat-header-info"><div class="chat-header-name">${esc(headerName)}</div><div class="chat-header-sub">${esc(headerSub)}</div></div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="typing-indicator" id="typingBar"></div>
      <div class="reply-bar" id="replyBar" style="display:none">
        <span class="reply-bar-text" id="replyText"></span>
        <button class="reply-bar-close" id="replyClose">×</button>
      </div>
      ${isRequestForMe?`<div style="padding:12px 16px"><div class="chat-notice">Хочет начать переписку<div class="chat-request-actions"><button class="chat-accept" id="chAccept">Принять</button><button class="chat-decline" id="chDecline">Отклонить</button></div></div></div>`:''}
      ${amIRequester&&!hasMessages?`<div style="padding:12px 16px"><div class="chat-notice">Ты можешь отправить только одно сообщение</div></div>`:''}
      ${data.accepted||isGroup||!amIRequester?`<div class="chat-input-area"><input type="text" id="chatInput" placeholder="Сообщение..." maxlength="500" autocomplete="off"><button class="mic-btn" id="micBtn" title="Голосовое">🎤</button><button id="chatSend">Отправить</button></div>`:''}
    </div>`;
    
  $('chatBack').onclick=closeChatView;
  if($('chAccept'))$('chAccept').onclick=async()=>{await updateDoc(cref,{accepted:true});toast('Принято');openChatView(cid,otherUid,isGroup,groupName)};
  if($('chDecline'))$('chDecline').onclick=async()=>{await updateDoc(cref,{blocked:true});toast('Отклонено');closeChatView();renderChatList()};
  
  if($('replyClose'))$('replyClose').onclick=()=>{replyToMsg=null;$('replyBar').style.display='none'};

  const msgs=$('chatMessages');
  const mq=query(collection(db,'chats',cid,'messages'),orderBy('createdAt','asc'));
  
  if(unsubChats)unsubChats();
  unsubChats=onSnapshot(mq,s=>{
    if(s.empty){msgs.innerHTML=`<div class="chat-empty" style="padding:20px"><div class="empty-text">Пока нет сообщений</div></div>`;return}
    msgs.innerHTML=s.docs.map(d=>{
      const m={id:d.id,...d.data()};
      const mine=m.authorId===cu.uid;
      const authorHTML=isGroup&&!mine?`<span class="chat-bubble-author">${esc(m.authorName||'?')}</span>`:'';
      
      let replyHTML='';
      if(m.replyTo){
        replyHTML=`<div class="reply-preview">${esc(m.replyTo.author)}: ${esc(m.replyTo.text||'🎤 Голосовое')}</div>`;
      }
      
      if(m.type==='voice'){
        return `<div class="chat-bubble ${mine?'mine':'theirs'}" data-mid="${m.id}">${authorHTML}${replyHTML}<div class="voice-bubble"><button class="voice-play" data-audio="${esc(m.audio)}">▶</button><div class="voice-wave">${Array.from({length:18}).map(()=>`<span class="voice-bar" style="height:${6+Math.random()*16}px"></span>`).join('')}</div><span class="voice-time">${m.duration||0}с</span></div><span class="chat-bubble-time">${ago(m.createdAt)}</span></div>`;
      }
      return `<div class="chat-bubble ${mine?'mine':'theirs'}" data-mid="${m.id}">${authorHTML}${replyHTML}${esc(m.text)}<span class="chat-bubble-time">${ago(m.createdAt)}</span></div>`;
    }).join('');
    msgs.scrollTop=msgs.scrollHeight;
    
    // Сохраняем для функции ответа
    window._lastMsgs=s.docs.map(d=>({id:d.id,...d.data()}));
  });

  // Индикатор "Печатает"
  if(unsubChatMeta)unsubChatMeta();
  unsubChatMeta=onSnapshot(cref,s=>{
    const d=s.data()||{};
    const typers=d.typing||{};
    const names=Object.keys(typers).filter(uid=>uid!==cu.uid&&(Date.now()-(typers[uid]?.toMillis?typers[uid].toMillis():typers[uid]||0))<4000);
    if(names.length){
      const who=names.map(uid=>usersCache[uid]?.name||'Кто-то').join(', ');
      $('typingBar').textContent=who+(names.length>1?' печатают...':' печатает...');
    }else{
      $('typingBar').textContent='';
    }
  });

  // Клик по сообщению для ответа
  msgs.addEventListener('click',e=>{
    const bubble=e.target.closest('.chat-bubble');if(!bubble)return;
    const mid=bubble.dataset.mid;if(!mid)return;
    const msg=window._lastMsgs?.find(m=>m.id===mid);if(!msg)return;

    $('replyBar').style.display='flex';
    if($('chatInput'))$('chatInput').focus();
  },true);

  if($('chatInput')){
    let typTimer=null;
    $('chatInput').addEventListener('input',()=>{
      updateDoc(cref,{[`typing.${cu.uid}`]:serverTimestamp()}).catch(()=>{});
      clearTimeout(typTimer);
      typTimer=setTimeout(()=>{updateDoc(cref,{[`typing.${cu.uid}`]:null}).catch(()=>{})},3000);
    });
    $('chatSend').onclick=()=>sendChatMessage(cid,data,isGroup);
    $('chatInput').onkeydown=e=>{if(e.key==='Enter')sendChatMessage(cid,data,isGroup)};
  }
}

async function sendChatMessage(cid,data,isGroup){
  const inp=$('chatInput');if(!inp)return;
  const t=inp.value.trim();if(!t)return;
  const cref=doc(db,'chats',cid);
  const snap=await getDoc(cref);
  const d=snap.data()||{};
  const isRequester=!isGroup&&d.requestedBy===cu.uid&&!d.accepted;
  if(isRequester&&(d.messageCount||0)>=1){toast('Только одно сообщение');return}
  inp.value='';
  
  const msgData={authorId:cu.uid,authorName:cu.name,text:t,createdAt:serverTimestamp(),deletedBy:[]};
  if(replyToMsg){
    msgData.replyTo={author:replyToMsg.authorName||'?',text:replyToMsg.type==='voice'?'🎤':replyToMsg.text||''};
    replyToMsg=null;$('replyBar').style.display='none';
  }
  
  try{
    await addDoc(collection(db,'chats',cid,'messages'),msgData);
    await updateDoc(cref,{lastMsg:t,lastAt:serverTimestamp(),messageCount:increment(1),deletedBy:[]});
  }catch(err){toast('Ошибка: '+err.message)}
}

/* ============ ГОЛОСОВЫЕ СООБЩЕНИЯ ============ */
let mediaRecorder=null,audioChunks=[],recordingStart=0;

document.addEventListener('click',async e=>{
  const btn=e.target.closest('#micBtn');if(!btn)return;
  if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    audioChunks=[];recordingStart=Date.now();
    
    mediaRecorder.ondataavailable=ev=>{if(ev.data.size>0)audioChunks.push(ev.data)};
    
    mediaRecorder.onstop=async()=>{
      btn.classList.remove('recording');btn.textContent='🎤';
      stream.getTracks().forEach(t=>t.stop());
      if(!audioChunks.length)return;
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      if(blob.size>500000){toast('Слишком длинное');return}
      const duration=Math.round((Date.now()-recordingStart)/1000);
      const reader=new FileReader();
      reader.onload=async()=>{
        const cref=doc(db,'chats',currentChatId);
        const snap=await getDoc(cref);
        const d=snap.data()||{};
        const isReq=!currentChatIsGroup&&d.requestedBy===cu.uid&&!d.accepted;
        if(isReq&&(d.messageCount||0)>=1){toast('Только одно сообщение');return}
        
        const msgData={authorId:cu.uid,authorName:cu.name,type:'voice',audio:reader.result,duration,createdAt:serverTimestamp(),deletedBy:[]};
        if(replyToMsg){
          msgData.replyTo={author:replyToMsg.authorName||'?',text:replyToMsg.type==='voice'?'🎤':replyToMsg.text||''};
          replyToMsg=null;if($('replyBar'))$('replyBar').style.display='none';
        }
        
        await addDoc(collection(db,'chats',currentChatId,'messages'),msgData);
        await updateDoc(cref,{lastMsg:'🎤 Голосовое',lastAt:serverTimestamp(),messageCount:increment(1),deletedBy:[]});
      };
      reader.readAsDataURL(blob);
    };
    
    mediaRecorder.start();
    btn.classList.add('recording');btn.textContent='⏹';
    toast('Запись... нажми ⏹ чтобы отправить');
  }catch(err){toast('Нет доступа к микрофону')}
});

document.addEventListener('click',e=>{
  const b=e.target.closest('.voice-play');if(!b)return;
  const audio=new Audio(b.dataset.audio);
  audio.play();b.textContent='⏸';audio.onended=()=>{b.textContent='▶'};
});

function clearCustomTheme(){['--bg','--card','--acc','--acct','--soft','--text','--muted','--bd','--font','--glow'].forEach(p=>document.documentElement.style.removeProperty(p))}
function applyCustomTheme(t){
  if(!t)return;clearCustomTheme();
  document.documentElement.setAttribute('data-theme','custom');
  const R=document.documentElement.style;
  if(t.bg)R.setProperty('--bg',t.bg);if(t.card)R.setProperty('--card',t.card);if(t.soft)R.setProperty('--soft',t.soft);
  if(t.acc)R.setProperty('--acc',t.acc);if(t.acct)R.setProperty('--acct',t.acct);if(t.text)R.setProperty('--text',t.text);
  if(t.muted)R.setProperty('--muted',t.muted);if(t.bd)R.setProperty('--bd',t.bd);if(t.font)R.setProperty('--font',t.font);
  if(t.glow)R.setProperty('--glow',`0 0 20px ${t.acc||'#b06bff'}`);
}

    const un=$('prefixUser').value.trim().replace(/^@+/,'').toLowerCase();
    const txt=$('prefixText').value.trim();
    if(!un||!txt)return toast('Введи данные');
    const qs=await getDocs(query(collection(db,'users'),where('username','==',un)));
    if(qs.empty)return toast('Не найден');
    await updateDoc(doc(db,'users',qs.docs[0].id),{prefix:txt,prefixColor:$('prefixColor').value});
    toast('Выдан');renderPrefixList();
  };
  $('clearAllPostsBtn').onclick=async()=>{if(!confirm('Удалить ВСЕ посты?'))return;const s=await getDocs(collection(db,'posts'));for(const d of s.docs)await deleteDoc(doc(db,'posts',d.id))};
  $('clearAllChatsBtn').onclick=async()=>{if(!confirm('Удалить ВСЕ чаты?'))return;const s=await getDocs(collection(db,'chats'));for(const d of s.docs)await deleteDoc(doc(db,'chats',d.id))};
  $('adminLogoutBtn').onclick=()=>{isAdmin=false;localStorage.removeItem('nexo_admin');closeModal();renderFeed()};
  
  $('userSearchInput').oninput=()=>renderAdminUsers($('userSearchInput').value.trim().toLowerCase());
  renderModList();renderAdminUsers('');renderAdList();renderPrefixList();
}

async function renderModList(){
  const box=$('modList');if(!box)return;
  const pending=postsCache.filter(p=>p.pending);
  if(!pending.length){box.innerHTML='<div style="font-size:12.5px;color:var(--muted);padding:8px 0">Нет постов</div>';return}
  box.innerHTML=pending.map(p=>`<div class="mod-item"><div class="mod-meta">@${esc(p.authorUsername)} · ${ago(p.createdAt)}</div><div class="mod-text">${esc(p.text||'(картинка)')}</div><div class="mod-actions"><button class="mod-approve" data-mod-approve="${p.id}">✓ Одобрить</button><button class="mod-delete" data-mod-del="${p.id}">🗑️ Удалить</button></div></div>`).join('');
  box.querySelectorAll('[data-mod-approve]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'posts',b.dataset.modApprove),{pending:false});toast('Одобрено');renderModList()});
  box.querySelectorAll('[data-mod-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить?'))return;await deleteDoc(doc(db,'posts',b.dataset.modDel));toast('Удалено');renderModList()});
}

function renderAdminUsers(q){
  const box=$('userList');if(!box)return;
  const all=Object.values(usersCache).filter(u=>u.username);
  const list=q?all.filter(u=>u.username.includes(q)||(u.name||'').toLowerCase().includes(q)):all.slice(0,20);
  box.innerHTML=list.map(u=>{
    const me=u.uid===cu.uid;const banned=u.banned?' 🚫':'';
    return `<div class="admin-item"><div style="display:flex;align-items:center;gap:10px;flex:1"><div><b>${esc(u.name)}</b>${banned}<br><small>@${esc(u.username)}</small></div></div>${me?'':`<div style="display:flex;gap:4px">${u.banned?`<button class="admin-btn" data-ban="${esc(u.uid)}" data-banned="1" style="background:#16a34a;padding:5px 8px;font-size:11.5px">Разбан</button>`:`<button class="admin-btn danger" data-ban="${esc(u.uid)}" style="padding:5px 8px;font-size:11.5px">Бан</button>`}<button class="admin-btn danger" data-deluser="${esc(u.uid)}" style="padding:5px 8px;font-size:11.5px">Удал</button></div>`}</div>`;
  }).join('');
  box.querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.ban,was=b.dataset.banned==='1';const u=usersCache[uid];
    if(was){await updateDoc(doc(db,'users',uid),{banned:false,banReason:''})}
    else{if(!confirm(`Забанить @${u.username}?`))return;await updateDoc(doc(db,'users',uid),{banned:true,banReason:'Нарушение правил'})}
    renderAdminUsers($('userSearchInput').value);
  });
  box.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=async()=>{
    const uid=b.dataset.deluser;if(!confirm('Удалить аккаунт?'))return;
    await updateDoc(doc(db,'users',uid),{banned:true,banReason:'Аккаунт удалён',deleted:true});renderAdminUsers($('userSearchInput').value);
  });
}

async function renderAdList(){
  const box=$('adList');if(!box)return;const snap=await getDocs(collection(db,'ads'));
  box.innerHTML=snap.docs.map(d=>{const a=d.data();return `<div class="admin-item"><span style="flex:1">${esc(a.title)}</span><button class="admin-btn danger" data-del-ad="${d.id}" style="padding:4px 8px;font-size:12px">×</button></div>`}).join('');
  box.querySelectorAll('[data-del-ad]').forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,'ads',b.dataset.delAd));renderAdList()});
}

async function renderPrefixList(){
  const box=$('prefixList');if(!box)return;const snap=await getDocs(collection(db,'users'));
  const list=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.prefix);
  box.innerHTML=list.map(u=>`<div class="admin-item"><span style="flex:1"><span class="prefix-badge" style="background:${u.prefixColor}">${u.prefix}</span> @${esc(u.username)}</span><button class="admin-btn danger" data-del-prefix="${u.id}" style="padding:4px 8px;font-size:12px">×</button></div>`).join('');
  box.querySelectorAll('[data-del-prefix]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',b.dataset.delPrefix),{prefix:null,prefixColor:null});renderPrefixList()});
}

/* ============ СТОРИС ============ */
const STORY_TTL=24*60*60*1000;
function loadStories(){
  if(unsubStories)unsubStories();
  unsubStories=onSnapshot(collection(db,'stories'),snap=>{
    const nowMs=Date.now();
    storiesCache=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>{
      const ts=s.createdAt?.toMillis?s.createdAt.toMillis():s.createdAt||0;
      return nowMs-ts<STORY_TTL;
    }).sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0));
    renderStories();
  });
}

function renderStories(){
  const container=$('storiesContainer');if(!container)return;
  const byUser={};storiesCache.forEach(s=>{if(!byUser[s.authorId])byUser[s.authorId]=[];byUser[s.authorId].push(s)});
  let html=`<div class="stories-row">
    <div class="story-item" data-story-add="1"><div class="story-ring add"><div class="story-ring-inner">+</div></div><div class="story-name">Добавить</div></div>`;
  Object.keys(byUser).forEach(uid=>{
    const u=usersCache[uid]||{name:'?'};const first=byUser[uid][0];
    const seen=(first.viewers||[]).includes(cu.uid);
    html+=`<div class="story-item" data-story-user="${esc(uid)}"><div class="story-ring ${seen?'seen':''}"><div class="story-ring-inner">${u.avatar?`<img src="${u.avatar}">`:esc(ini(u.name))}</div></div><div class="story-name">${uid===cu.uid?'Моя':esc(u.name)}</div></div>`;
  });
  html+='</div>';container.innerHTML=html;
  container.querySelector('[data-story-add]').onclick=()=>addStory();
  container.querySelectorAll('[data-story-user]').forEach(el=>el.onclick=()=>viewStories(el.dataset.storyUser));
}

function addStory(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=await compressImage(f,700,0.7);await addDoc(collection(db,'stories'),{authorId:cu.uid,image:data,viewers:[],createdAt:serverTimestamp()});toast('Добавлено')}catch(err){toast('Ошибка')}};
  inp.click();
}

function viewStories(uid){
  const list=storiesCache.filter(s=>s.authorId===uid).reverse();if(!list.length)return;
  const viewer=document.createElement('div');viewer.className='story-viewer open';viewer.id='storyViewer';
  viewer.innerHTML=`<button class="story-close" id="storyClose">×</button><div class="story-progress" id="storyProgress"></div><div class="story-content" id="storyContent"></div>`;
  document.body.appendChild(viewer);
  $('storyClose').onclick=()=>viewer.remove();
  const progress=$('storyProgress');progress.innerHTML=list.map(()=>`<div class="story-progress-bar"><div></div></div>`).join('');
  const bars=progress.querySelectorAll('.story-progress-bar>div');
  let i=0;
  function show(){
    if(i>=list.length){viewer.remove();return}
    bars.forEach((b,idx)=>b.style.width=idx<i?'100%':idx>i?'0':'0');
    $('storyContent').innerHTML=`<img src="${list[i].image}">`;
    let w=0;const timer=setInterval(()=>{w+=2;bars[i].style.width=Math.min(w,100)+'%';if(w>=100){clearInterval(timer);i++;setTimeout(show,100)}},60);
    if(!(list[i].viewers||[]).includes(cu.uid))updateDoc(doc(db,'stories',list[i].id),{viewers:arrayUnion(cu.uid)}).catch(()=>{});
  }
  show();
}

/* ============ СТАРТ ============ */
if(localStorage.getItem('nexo_admin')==='1')isAdmin=true;
/* ============ ДОБАВЛЕННЫЕ ФУНКЦИИ ============ */

// 1. Модальные окна
function openModal(html) {
  $('modal').innerHTML = html;
  $('modalBackdrop').classList.add('open');
  const closeBtn = $('modal').querySelector('.modal-close');
  if (closeBtn) closeBtn.onclick = closeModal;
}

function closeModal() {
  $('modalBackdrop').classList.remove('open');
  $('modal').innerHTML = '';
}

$('modalBackdrop').onclick = (e) => {
  if (e.target === $('modalBackdrop')) closeModal();
};

// 2. Поиск
function renderSearch() {
  const q = $('searchInput') ? $('searchInput').value.trim().toLowerCase() : '';
  const resultsBox = $('searchResults');
  if (!resultsBox) return;

  let users = Object.values(usersCache).filter(u => u.uid !== cu.uid);

  if (searchTab === 'friends') {
    users = users.filter(u => (cu.following || []).includes(u.uid));
  } else if (searchTab === 'all') {
    // Показываем всех
  } else {
    if (q) {
      users = users.filter(u =>
        (u.name || '').toLowerCase().includes(q) ||
        (u.username || '').toLowerCase().includes(q)
      );
    } else {
      resultsBox.innerHTML = '<div class="empty-text" style="text-align:center;padding:20px;color:var(--muted)">Введите запрос для поиска</div>';
      return;
    }
  }

  if (!users.length) {
    resultsBox.innerHTML = '<div class="empty-text" style="text-align:center;padding:20px;color:var(--muted)">Ничего не найдено</div>';
    return;
  }

  resultsBox.innerHTML = users.map(u => {
    const f = (cu.following || []).includes(u.uid);
    return `<div class="user-row">
      ${avHTML(u, 'sm')}
      <div class="user-row-info" data-action="open-user" data-author="${esc(u.uid)}" style="cursor:pointer">
        <div class="user-row-name">${esc(u.name || 'Без имени')}</div>
        <div class="user-row-handle">@${esc(u.username)}</div>
      </div>
      <button class="btn-follow ${f ? 'following' : ''}" data-action="follow" data-author="${esc(u.uid)}">${f ? 'Отписаться' : 'Подписаться'}</button>
    </div>`;
  }).join('');
}

if ($('searchInput')) {
  $('searchInput').oninput = () => {
    if (searchTab === 'search') renderSearch();
  };
}

if ($('searchTabs')) {
  $('searchTabs').querySelectorAll('[data-stab]').forEach(btn => {
    btn.onclick = () => {
      $('searchTabs').querySelectorAll('[data-stab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      searchTab = btn.dataset.stab;
      renderSearch();
    };
  });
}

// 3. Редактирование профиля
$('editProfileBtn').onclick = () => {
  openModal(`<div class="modal-head"><div class="modal-title">Редактировать профиль</div><button class="modal-close">×</button></div><div class="modal-body">
    <div class="field"><input type="text" id="editName" placeholder="Имя" value="${esc(cu.name||'')}"></div>
    <div class="field"><input type="text" id="editUsername" placeholder="@username" value="${esc(cu.username||'')}"></div>
    <div class="field"><textarea id="editBio" placeholder="О себе" maxlength="200">${esc(cu.bio||'')}</textarea></div>
    <button class="btn-primary" id="saveProfileBtn">Сохранить</button>
  </div>`);

  $('saveProfileBtn').onclick = async () => {
    const newName = $('editName').value.trim();
    const newUsername = $('editUsername').value.trim().replace(/^@+/, '').toLowerCase();
    const newBio = $('editBio').value.trim();

    if (!newName || !newUsername) return toast('Имя и @username обязательны');

    try {
      if (newUsername !== cu.username) {
        const qs = await getDocs(query(collection(db, 'users'), where('username', '==', newUsername)));
        if (!qs.empty) return toast('Этот @username занят');
      }

      await updateDoc(doc(db, 'users', cu.uid), { name: newName, username: newUsername, bio: newBio });
      cu.name = newName;
      cu.username = newUsername;
      cu.bio = newBio;

      closeModal();
      toast('Профиль обновлён');
      renderProf();
      refreshTop();
    } catch (err) {
      toast('Ошибка: ' + err.message);
    }
  };
};
</script>
