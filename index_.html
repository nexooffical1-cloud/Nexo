<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nexo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafafa;--soft:#f0f0f0;--card:#fff;--text:#0a0a0a;--soft2:#333;--muted:#8a8a8a;--bd:#ececec;--bds:#d5d5d5;--acc:#0a0a0a;--acct:#fff;--acch:#2a2a2a;--dgr:#e5484d;--like:#e5484d;--rp:#16a34a;--r:14px;--sh:0 4px 20px rgba(0,0,0,.04);--shl:0 10px 40px rgba(0,0,0,.08);--tb:rgba(250,250,250,.88);--glow:none;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--brand:#1e6bff}
html[data-theme=dark]{--bg:#0f0f0f;--soft:#1a1a1a;--card:#171717;--text:#f5f5f5;--soft2:#d4d4d4;--muted:#8a8a8a;--bd:#262626;--bds:#333;--acc:#f5f5f5;--acct:#0a0a0a;--acch:#d4d4d4;--dgr:#ff6b6b;--like:#ff6b6b;--rp:#4ade80;--sh:0 4px 20px rgba(0,0,0,.4);--shl:0 10px 40px rgba(0,0,0,.5);--tb:rgba(15,15,15,.88)}
html[data-theme=mystic]{--bg:#1a0b2e;--soft:#2d1b4e;--card:#251445;--text:#f0e6ff;--soft2:#d8c8f0;--muted:#a58fc9;--bd:rgba(160,90,255,.22);--bds:rgba(160,90,255,.45);--acc:#b06bff;--acct:#fff;--acch:#c98bff;--dgr:#ff6b9d;--like:#ff6b9d;--rp:#6bffb0;--sh:0 4px 24px rgba(138,43,226,.25);--shl:0 10px 40px rgba(138,43,226,.4);--tb:rgba(26,11,46,.88);--glow:0 0 20px rgba(176,107,255,.4)}
html[data-theme=mystic] body{background:radial-gradient(circle at 15% 10%,rgba(176,107,255,.15),transparent 45%),radial-gradient(circle at 90% 90%,rgba(120,60,200,.2),transparent 50%),linear-gradient(160deg,#1a0b2e,#2d1b4e);background-attachment:fixed}
html,body{height:100%;overflow-x:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px}
img{display:block;max-width:100%}
.brand-x{color:var(--brand)}
html[data-theme=mystic] .brand-x{color:#7eb0ff;text-shadow:0 0 12px rgba(126,176,255,.4)}
.avatar{width:44px;height:44px;min-width:44px;min-height:44px;max-width:44px;max-height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;overflow:hidden;background:var(--acc);color:var(--acct);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;line-height:1;user-select:none;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar.sm{width:40px;height:40px;min-width:40px;min-height:40px;max-width:40px;max-height:40px;font-size:15px}
.avatar.lg{width:72px;height:72px;min-width:72px;min-height:72px;max-width:72px;max-height:72px;font-size:26px}
.online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.verified{color:#1e6bff;font-size:14px;margin-left:3px}html[data-theme=mystic] .verified{color:#7eb0ff}
.emoji-status{font-size:14px;margin-left:4px}
.auth-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.auth-screen.hidden{display:none}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:36px 26px;box-shadow:var(--shl)}
.auth-logo{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.auth-subtitle{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
.auth-footer{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:15px;font-weight:800;letter-spacing:.3px;opacity:.7;pointer-events:none}
.field{margin-bottom:14px}
.field input,.field textarea{width:100%;padding:13px 15px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;font-size:16px;color:var(--text);outline:none;transition:.15s}
.field textarea{resize:vertical;min-height:70px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field input:focus,.field textarea:focus{border-color:var(--acc);background:var(--card)}
.field input.error{border-color:var(--dgr)}
.error-msg{color:var(--dgr);font-size:12.5px;margin-top:6px;padding-left:4px;min-height:16px;display:none}
.error-msg.show{display:block}
.btn-primary{width:100%;padding:13px;background:var(--acc);color:var(--acct);border:none;border-radius:12px;font-size:15px;font-weight:600;margin-top:10px;transition:.15s;box-shadow:var(--glow)}
.btn-primary:hover{background:var(--acch)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{width:100%;padding:13px;background:transparent;color:var(--text);border:1px solid var(--bd);border-radius:12px;font-size:15px;font-weight:600;margin-top:8px;transition:.15s}
.btn-secondary:hover{background:var(--soft)}
.btn-google{width:100%;padding:13px;background:var(--card);color:var(--text);border:1px solid var(--bd);border-radius:12px;font-size:15px;font-weight:600;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
.btn-google:hover{background:var(--soft)}
.link-muted{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:14px;text-decoration:none;cursor:pointer}
.link-muted:hover{color:var(--text)}
.lang-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;font-size:14px;color:var(--text);margin-bottom:8px;transition:.15s;text-align:left}
.lang-btn:hover{background:var(--card);border-color:var(--bds)}
.lang-btn.active{border-color:var(--acc);background:var(--card);font-weight:600}
.lang-btn .flag{margin-right:10px}
.lang-btn .check{color:var(--acc);font-weight:700}
.theme-pills{display:flex;gap:6px;margin-top:8px}
.theme-pill{flex:1;padding:10px 4px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;font-size:11.5px;color:var(--text);transition:.15s;text-align:center;cursor:pointer}
.theme-pill:hover{background:var(--card)}
.theme-pill.active{border-color:var(--acc);background:var(--card);font-weight:600}
.theme-pill .dot{display:block;width:20px;height:20px;border-radius:50%;margin:0 auto 5px;border:1px solid var(--bd)}
.pill-light .dot{background:linear-gradient(135deg,#fff,#e8e8e8)}
.pill-dark .dot{background:linear-gradient(135deg,#2a2a2a,#0a0a0a)}
.pill-mystic .dot{background:linear-gradient(135deg,#b06bff,#4a1d7a)}
.pill-custom .dot{background:linear-gradient(135deg,#ff6b9d,#b06bff)}
.section-label{font-size:12px;color:var(--muted);margin:20px 0 8px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.app-screen{display:none;min-height:100dvh}
.app-screen.active{display:block}
.topbar{position:sticky;top:0;z-index:10;background:var(--tb);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.topbar-inner{max-width:640px;margin:0 auto;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;flex-shrink:0}
.nav-tabs{display:flex;gap:3px;background:var(--soft);padding:4px;border-radius:12px;flex-shrink:0}
.nav-tabs button{padding:7px 9px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;border-radius:9px;white-space:nowrap}
.nav-tabs button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.user-chip{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:0}
.user-chip .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;text-align:right}
.user-chip .handle{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;text-align:right}
.container{max-width:640px;margin:0 auto;padding:16px 12px 90px;width:100%}
.screen{display:none}
.screen.active{display:block}
.profile-header{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh);position:relative}
.profile-menu-btn{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--text);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;padding-bottom:8px;cursor:pointer;transition:.15s}
.profile-menu-btn:hover{background:var(--soft)}
.profile-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;padding-right:40px}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:19px;font-weight:700;margin-bottom:2px;word-wrap:break-word}
.profile-handle{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.profile-bio{font-size:14.5px;color:var(--soft2);white-space:pre-wrap;word-wrap:break-word}
.profile-bio.empty{color:var(--muted);font-style:italic}
.profile-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-edit{padding:9px 14px;background:transparent;border:1px solid var(--bd);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text);transition:.15s}
.btn-edit:hover{background:var(--soft)}
.btn-publish{padding:9px 14px;background:var(--acc);color:var(--acct);border:none;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--glow);transition:.15s}
.btn-publish:hover{background:var(--acch)}
.stats{display:flex;gap:20px;padding-top:14px;margin-top:14px;border-top:1px solid var(--bd)}
.stat{display:flex;flex-direction:column}
.stat-num{font-size:17px;font-weight:700}
.stat-label{font-size:12.5px;color:var(--muted)}
.stat.clickable{cursor:pointer}
.profile-posts-title{font-size:15px;font-weight:700;margin-bottom:12px}
.profile-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:flex-end;z-index:150;padding:60px 16px 16px}
.profile-menu-backdrop.open{display:flex}
.profile-menu{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:var(--shl);min-width:230px}
.profile-menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:none;border-radius:10px;font-size:14.5px;color:var(--text);text-align:left;font-weight:500;transition:.15s}
.profile-menu-item:hover{background:var(--soft)}
.profile-menu-item span:first-child{font-size:18px}
.feed{display:flex;flex-direction:column;gap:12px}
.post{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.post.pending{border:2px dashed #f59e0b}
.post.pending::before{content:'⏳ На проверке';display:block;font-size:12px;color:#f59e0b;font-weight:600;margin-bottom:8px;padding:4px 10px;background:rgba(245,158,11,.1);border-radius:8px;width:fit-content}
.post-main{display:flex;gap:12px}
.post-body{flex:1;min-width:0}
.post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.post-name{font-weight:600;font-size:15px}
.post-handle,.post-dot,.post-time{color:var(--muted);font-size:13px}
.post-text{font-size:15.5px;white-space:pre-wrap;word-wrap:break-word;color:var(--soft2);margin-top:4px}
.post-coauthor{font-size:13px;color:var(--muted);margin-bottom:6px}
.post-coauthor b{color:var(--acc);font-weight:600}
.post-img{margin-top:8px;margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.post-img img{width:100%;height:auto;max-height:500px;object-fit:cover;display:block}
.post-media-grid{display:grid;gap:4px;margin-top:8px;margin-bottom:10px;border-radius:12px;overflow:hidden}
.post-media-grid.c1{grid-template-columns:1fr}
.post-media-grid.c2{grid-template-columns:1fr 1fr}
.post-media-grid.c3{grid-template-columns:1fr 1fr}
.post-media-grid.c3 .pm:first-child{grid-row:span 2}
.post-media-grid.c4{grid-template-columns:1fr 1fr}
.pm{position:relative;aspect-ratio:1;overflow:hidden;background:var(--soft)}
.pm img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.post-actions{display:flex;gap:4px;margin-top:12px;margin-left:56px;padding-top:10px;border-top:1px solid var(--bd);flex-wrap:wrap}
.action-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;border:none;border-radius:8px;font-size:13.5px;color:var(--muted);font-weight:500;transition:.15s}
.action-btn:hover{background:var(--soft);color:var(--text)}
.action-btn svg{width:16px;height:16px;flex-shrink:0}
.action-btn.liked{color:var(--like)}
.action-btn.liked svg{fill:var(--like);stroke:var(--like)}
.action-btn.reposted{color:var(--rp)}
.action-btn.reposted svg{stroke:var(--rp)}
.btn-follow{padding:5px 12px;background:var(--acc);color:var(--acct);border:none;border-radius:8px;font-size:12.5px;font-weight:600;flex-shrink:0;align-self:flex-start;box-shadow:var(--glow);transition:.15s}
.btn-follow:hover{background:var(--acch)}
.btn-follow.following{background:transparent;color:var(--muted);border:1px solid var(--bd);box-shadow:none}
.post-reactions{display:flex;gap:4px;margin-top:10px;margin-left:56px;padding-top:8px;flex-wrap:wrap}
.react-btn{padding:5px 10px;background:var(--soft);border:1px solid var(--bd);border-radius:20px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text);font-family:inherit;transition:.15s}
.react-btn:hover{background:var(--card);transform:scale(1.05)}
.react-btn.active{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.hashtag{color:var(--brand);font-weight:600;cursor:pointer}
html[data-theme=mystic] .hashtag{color:#7eb0ff}
.hashtag:hover{text-decoration:underline}
.poll-box{margin-top:10px;padding:12px;background:var(--soft);border-radius:12px;border:1px solid var(--bd)}
.poll-q{font-weight:600;font-size:14.5px;margin-bottom:10px}
.poll-opt{position:relative;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer;overflow:hidden;font-size:14px;transition:.15s}
.poll-opt:hover{border-color:var(--acc)}
.poll-opt .poll-fill{position:absolute;top:0;left:0;height:100%;background:rgba(30,107,255,.15);transition:width .4s;z-index:0}
html[data-theme=mystic] .poll-opt .poll-fill{background:rgba(126,176,255,.2)}
.poll-opt .poll-label{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
.poll-opt.voted{font-weight:600}
.poll-total{margin-top:8px;font-size:12.5px;color:var(--muted)}
.ad-badge{display:inline-block;background:var(--acc);color:var(--acct);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.post.ad{background:linear-gradient(135deg,rgba(176,107,255,.08),rgba(255,107,157,.08));border:2px solid var(--acc)}
.post.ad .post-name{color:var(--acc);font-weight:700}
.prefix-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;margin-right:6px;color:#fff}
.post-avatar-click{cursor:pointer}
.post-name-click{cursor:pointer}
.comments{margin-top:12px;margin-left:56px;padding-top:12px;border-top:1px solid var(--bd);display:none}
.comments.open{display:block}
.comment{display:flex;gap:10px;padding:8px 0}
.comment-body{flex:1;min-width:0}
.comment-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.comment-name{font-weight:600;font-size:13.5px}
.comment-handle,.comment-time{color:var(--muted);font-size:12.5px}
.comment-text{font-size:14px;color:var(--soft2);white-space:pre-wrap;word-break:break-word}
.comment-form{display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.comment-form input{flex:1;padding:9px 12px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;font-size:14px;color:var(--text);outline:none;min-width:0}
.comment-form button{padding:0 14px;background:var(--acc);color:var(--acct);border:none;border-radius:10px;font-size:13px;font-weight:600;flex-shrink:0}
.comments-empty{font-size:13px;color:var(--muted);padding:8px 0;font-style:italic}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty-text{font-size:14px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-backdrop.open{display:flex}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shl);color:var(--text)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:transparent;border:none;font-size:22px;color:var(--muted);line-height:1;padding:0 4px;border-radius:6px}
.modal-body{padding:12px 18px 18px;overflow-y:auto;flex:1}
.user-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.user-row:last-child{border-bottom:none}
.user-row-info{flex:1;min-width:0}
.user-row-name{font-size:14px;font-weight:600}
.user-row-handle{font-size:12.5px;color:var(--muted)}
.modal-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--acc);color:var(--acct);padding:11px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shl);transition:transform .3s;z-index:600;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:400;font-size:14px;color:var(--muted)}
.loader.hidden{display:none}
.notif-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-200px);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;box-shadow:var(--shl);z-index:500;max-width:380px;width:calc(100% - 24px);transition:transform .3s;cursor:pointer}
.notif-banner.show{transform:translateX(-50%) translateY(0)}
.notif-banner-title{font-size:14px;font-weight:700;margin-bottom:2px}
.notif-banner-text{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list{display:flex;flex-direction:column;gap:8px}
.chat-item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;box-shadow:var(--sh);position:relative}
.chat-item-info{flex:1;min-width:0}
.chat-item-name{font-size:15px;font-weight:600;margin-bottom:2px}
.chat-item-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item-badge{background:var(--acc);color:var(--acct);border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:600;flex-shrink:0}
.chat-item-del{position:absolute;top:8px;right:8px;background:transparent;border:none;color:var(--muted);font-size:16px;padding:2px 6px;border-radius:6px;opacity:0;transition:.15s}
.chat-item:hover .chat-item-del{opacity:1}
.chat-window{display:flex;flex-direction:column;height:calc(100dvh - 200px);background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.chat-header{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.chat-header .back-btn{background:transparent;border:none;font-size:20px;color:var(--text);padding:0 6px;font-family:inherit;cursor:pointer}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:15px;font-weight:600}
.chat-header-sub{font-size:12px;color:var(--muted)}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.chat-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap;position:relative}
.chat-bubble.mine{align-self:flex-end;background:var(--acc);color:var(--acct);border-bottom-right-radius:4px}
.chat-bubble.theirs{align-self:flex-start;background:var(--soft);color:var(--text);border-bottom-left-radius:4px}
.chat-bubble-author{font-size:11.5px;font-weight:700;color:var(--acc);margin-bottom:4px;display:block}
.chat-bubble.mine .chat-bubble-author{color:var(--acct);opacity:.8}
.chat-bubble-time{font-size:11px;opacity:.75;margin-top:4px;display:block}
.chat-input-area{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-shrink:0}
.chat-input-area input{flex:1;padding:11px 14px;background:var(--soft);border:1px solid var(--bd);border-radius:12px;font-size:16px;color:var(--text);outline:none;min-width:0}
.chat-input-area button{padding:0 16px;height:42px;background:var(--acc);color:var(--acct);border:none;border-radius:12px;font-size:14px;font-weight:600;flex-shrink:0}
.mic-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0!important}
.mic-btn.recording{background:var(--dgr);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.voice-bubble{display:flex;align-items:center;gap:10px;min-width:180px;padding:4px 0}
.voice-play{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);border:none;color:inherit;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.chat-bubble.theirs .voice-play{background:rgba(0,0,0,.08)}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-bar{width:3px;background:currentColor;border-radius:2px;opacity:.6}
.voice-time{font-size:11.5px;opacity:.85;min-width:32px;text-align:right;font-weight:600}
.chat-notice{text-align:center;font-size:13px;color:var(--muted);padding:14px;background:var(--soft);border-radius:12px;margin:8px 0;line-height:1.5}
.chat-request-actions{display:flex;gap:8px;justify-content:center;margin-top:10px}
.chat-request-actions button{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.chat-accept{background:var(--acc);color:var(--acct);border:none}
.chat-decline{background:transparent;color:var(--text);border:1px solid var(--bd)}
.chat-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.chat-new-btn{width:100%;padding:12px;background:transparent;border:1px dashed var(--bd);border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:8px;font-family:inherit}
.group-avatar{background:linear-gradient(135deg,var(--brand),#7eb0ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.theme-custom-box{display:none;margin-top:12px;padding:14px;background:var(--soft);border-radius:12px;border:1px solid var(--bd)}
.theme-custom-box.open{display:block}
.color-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13.5px}
.color-row input[type=color]{width:44px;height:32px;border:1px solid var(--bd);border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.color-row select{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13.5px}
.toggle-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
.admin-section{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.admin-section h4{font-size:14px;margin-bottom:10px;color:var(--text)}
.admin-input{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:14px;color:var(--text);outline:none;margin-bottom:8px}
.admin-btn{padding:9px 14px;background:var(--acc);color:var(--acct);border:none;border-radius:8px;font-size:13px;font-weight:600;margin-right:6px;cursor:pointer;transition:.15s}
.admin-btn:hover{opacity:.8}
.admin-btn.danger{background:var(--dgr)}
.admin-list{max-height:200px;overflow-y:auto}
.admin-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.admin-item:last-child{border-bottom:none}
.admin-item-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-profile-header{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh);position:relative}
.user-profile-header .back-row{margin-bottom:14px}
.user-profile-header .back-btn{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.mod-item{padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card);font-size:13px}
.mod-item .mod-text{margin:6px 0;color:var(--text);word-break:break-word}
.mod-item .mod-meta{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.mod-item .mod-actions{display:flex;gap:6px}
.mod-approve{background:#16a34a;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.mod-delete{background:var(--dgr);color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.coauthor-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--soft);border:1px solid var(--bd);border-radius:20px;font-size:12.5px;color:var(--text);margin:4px 4px 0 0}
.coauthor-pill .rm{color:var(--dgr);font-weight:700;cursor:pointer}
.upload-placeholder{border:2px dashed var(--bd);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:10px;transition:.15s}
.upload-placeholder:hover{border-color:var(--acc);color:var(--text)}
.upload-placeholder .icon{font-size:24px;margin-bottom:6px}
.composer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:8px}
.composer-grid .pm{border-radius:8px;border:1px solid var(--bd)}
.composer-grid .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;padding:0}
.stories-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;margin-bottom:10px;scrollbar-width:none}
.stories-row::-webkit-scrollbar{display:none}
.story-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:66px}
.story-ring{width:60px;height:60px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff6b9d,#b06bff,#1e6bff);display:flex;align-items:center;justify-content:center}
.story-ring.seen{background:var(--bd)}
.story-ring.add{background:var(--soft);border:1px dashed var(--bd)}
.story-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;font-size:20px;color:var(--muted)}
.story-ring-inner img{width:100%;height:100%;object-fit:cover}
.story-name{font-size:11px;color:var(--muted);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.story-viewer{position:fixed;inset:0;background:#000;z-index:800;display:none;flex-direction:column}
.story-viewer.open{display:flex}
.story-progress{display:flex;gap:3px;padding:10px 12px}
.story-progress-bar{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-progress-bar>div{height:100%;background:#fff;width:0;transition:width .05s linear}
.story-content{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.story-content img{max-width:100%;max-height:100%;object-fit:contain}
.story-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;z-index:5}
.typing-indicator{font-size:12.5px;color:var(--muted);padding:4px 14px;font-style:italic;height:18px;text-align:left}
.reply-preview{font-size:12px;padding:6px 10px;background:rgba(0,0,0,.1);border-left:3px solid var(--acc);border-radius:8px;margin-bottom:6px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.chat-bubble.mine .reply-preview{background:rgba(255,255,255,.15);border-left-color:var(--acct)}
.reply-bar{padding:8px 14px;background:var(--soft);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.reply-bar-text{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.reply-bar-close{background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.avatar-upload{display:flex;justify-content:center;margin-bottom:20px}
.avatar-circle{width:90px;height:90px;border-radius:50%;background:var(--soft);border:2px dashed var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:.15s}
.avatar-circle:hover{border-color:var(--acc);background:var(--card)}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.drop-zone.dragover{border-color:var(--acc);background:var(--card)}
.search-tabs{display:flex;gap:6px;margin-bottom:12px}
.search-tabs button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--soft);border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.search-tabs button.active{background:var(--card);color:var(--text);border-color:var(--acc)}
/* Стили для кнопок блокировки (в один размер с кнопкой подписки) */
.block-btn, .unblock-btn {
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  flex-shrink: 0;
  align-self: flex-start;
  transition: .15s;
  cursor: pointer;
  font-family: inherit;
  border: 1px solid transparent;
}

/* Заблокировать - красная контурная кнопка */
.block-btn {
  background: transparent;
  color: var(--dgr);
  border-color: var(--bd);
}
.block-btn:hover {
  background: rgba(229, 72, 77, 0.08);
  border-color: var(--dgr);
}

/* Разблокировать - зеленая контурная кнопка */
.unblock-btn {
  background: transparent;
  color: var(--rp);
  border-color: var(--bd);
}
.unblock-btn:hover {
  background: rgba(22, 163, 74, 0.08);
  border-color: var(--rp);
}
</style>
</head>
<body>
<div class="loader" id="loader">Загрузка...</div>
<div class="auth-screen hidden" id="welcomeScreen">
  <div class="auth-card">
    <div class="auth-logo">Ne<span class="brand-x">x</span>o</div>
    <div class="auth-subtitle">Выбери язык и тему</div>
    <div class="section-label">Язык</div>
    <button class="lang-btn active" data-lang="ru"><span><span class="flag">🇷🇺</span>Русский</span><span class="check">✓</span></button>
    <button class="lang-btn" data-lang="en"><span><span class="flag">🇬🇧</span>English</span><span class="check"></span></button>
    <button class="lang-btn" data-lang="az"><span><span class="flag">🇦🇿</span>Azərbaycan</span><span class="check"></span></button>
    <div class="section-label">Тема</div>
    <div class="theme-pills">
      <div class="theme-pill pill-light active" data-theme="light"><span class="dot"></span>Светлая</div>
      <div class="theme-pill pill-dark" data-theme="dark"><span class="dot"></span>Тёмная</div>
      <div class="theme-pill pill-mystic" data-theme="mystic"><span class="dot"></span>Мистика</div>
      <div class="theme-pill pill-custom" data-theme="custom"><span class="dot"></span>Своя</div>
    </div>
    <button type="button" class="btn-primary" id="welcomeContinue" style="margin-top:20px">Продолжить</button>
  </div>
</div>

<div class="auth-screen hidden" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">Ne<span class="brand-x">x</span>o</div>
    <div class="auth-subtitle" id="authSubtitle">Войди в свой аккаунт</div>
    
    <form id="authForm" novalidate>
      <div class="field"><input type="email" id="emailInput" placeholder="Email" autocomplete="email"><div class="error-msg" id="emailError"></div></div>
      <div class="field"><input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password"><div class="error-msg" id="passwordError"></div></div>
      <div class="field"><input type="text" id="codeInput" placeholder="Кастомный код" autocomplete="off"><div class="error-msg" id="codeError"></div></div>
      <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
      <button type="button" class="btn-google" id="googleLoginBtn"><span style="color:#4285F4;font-weight:900">G</span> Войти с помощью Google</button>
      <a class="link-muted" id="forgotCodeBtn">Забыли кастомный код? Восстановить через Telegram</a>
      <button type="button" class="btn-secondary" id="toRegisterBtn">Зарегистрироваться</button>
    </form>

    <div id="regForm" style="display:none">
      <div class="field"><input type="email" id="regEmail" placeholder="Email" autocomplete="email"><div class="error-msg" id="regEmailError"></div></div>
      <div class="field"><input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password"><div class="error-msg" id="regPasswordError"></div></div>
      <div class="field"><input type="password" id="regPassword2" placeholder="Повтори пароль" autocomplete="new-password"><div class="error-msg" id="regPassword2Error"></div></div>
      <div class="field"><input type="text" id="regCode" placeholder="Кастомный код (например nexo_alex)" autocomplete="off"><div class="error-msg" id="regCodeError"></div></div>
      <button type="button" class="btn-primary" id="registerBtn">Продолжить</button>
      <button type="button" class="btn-google" id="googleRegBtn"><span style="color:#4285F4;font-weight:900">G</span> Зарегистрироваться через Google</button>
      <button type="button" class="btn-secondary" id="toLoginBtn">У меня уже есть аккаунт</button>
    </div>
  </div>
</div>

<div class="auth-screen hidden" id="profileSetupScreen">
  <div class="auth-card">
    <div class="auth-logo">Ne<span class="brand-x">x</span>o</div>
    <div class="auth-subtitle">Расскажи о себе</div>
    <form id="setupForm" novalidate>
      <div class="avatar-upload">
        <div class="avatar-circle drop-zone" id="setupAvatarCircle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;color:var(--muted)"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <input type="file" id="setupAvatarInput" accept="image/*" hidden>
      </div>
      <div class="field"><input type="text" id="setupName" placeholder="Имя" autocomplete="off"><div class="error-msg" id="setupNameError"></div></div>
      <div class="field"><input type="text" id="setupUsername" placeholder="@username" autocomplete="off"><div class="error-msg" id="setupUsernameError"></div></div>
      <div class="field"><textarea id="setupBio" placeholder="Не пью, не курю, люблю котиков" maxlength="200"></textarea></div>
      <button type="submit" class="btn-primary" id="setupSubmitBtn">Готово</button>
    </form>
  </div>
</div>
<div class="app-screen" id="appScreen">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Ne<span class="brand-x">x</span>o</div>
      <nav class="nav-tabs">
        <button id="tabFeed" class="active">Лента</button>
        <button id="tabSearch">Поиск</button>
        <button id="tabChats">Чаты</button>
        <button id="tabProfile">Профиль</button>
      </nav>
      <div class="user-chip">
        <div><div class="name" id="chipName">—</div><div class="handle" id="chipHandle">@—</div></div>
        <div class="avatar sm" id="chipAvatar"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Лента -->
    <section class="screen active" id="screenFeed">
      <div id="storiesContainer"></div>
      <div class="feed" id="feed"></div>
    </section>

    <!-- Поиск -->
    <section class="screen" id="screenSearch">
      <div class="field" style="margin-bottom:12px"><input type="text" id="searchInput" placeholder="🔍 Поиск по имени или @username" autocomplete="off"></div>
      <div class="search-tabs" id="searchTabs">
        <button data-stab="search" class="active">Поиск</button>
        <button data-stab="friends">Друзья</button>
        <button data-stab="all">Все</button>
      </div>
      <div id="searchResults"></div>
    </section>

    <!-- Чаты -->
    <section class="screen" id="screenChats">
      <button class="chat-new-btn" id="newGroupBtn">+ Создать группу</button>
      <div id="chatList" class="chat-list"></div>
      <div id="chatView" style="display:none"></div>
    </section>

    <!-- Уведомления -->
    <section class="screen" id="screenNotifs">
      <div class="notif-list" id="notifList"></div>
    </section>

    <!-- Мой профиль -->
    <section class="screen" id="screenProfile">
      <div class="profile-header">
        <div class="profile-menu-btn" id="profileMenuBtn" title="Меню">⋮</div>
        <div class="profile-top">
          <div class="avatar lg" id="profileAvatar"></div>
          <div class="profile-info">
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-handle" id="profileHandle">@—</div>
            <div class="profile-bio empty" id="profileBio">Описание пока нет</div>
          </div>
        </div>
        <div class="profile-actions">
          <button class="btn-publish" id="openPublishBtn">Опубликовать пост</button>
          <button class="btn-edit" id="editProfileBtn">Редактировать профиль</button>
        </div>
        <div class="stats">
          <div class="stat"><span class="stat-num" id="statPosts">0</span><span class="stat-label">Постов</span></div>
          <div class="stat clickable" id="statFollowersBtn"><span class="stat-num" id="statFollowers">0</span><span class="stat-label">Подписчиков</span></div>
          <div class="stat clickable" id="statFollowingBtn"><span class="stat-num" id="statFollowing">0</span><span class="stat-label">Подписок</span></div>
        </div>
      </div>
      <div class="profile-posts-title">Мои посты</div>
      <div class="feed" id="profileFeed"></div>
    </section>

    <!-- Чужой профиль -->
    <section class="screen" id="screenUser">
      <div id="userProfileHeader"></div>
      <div class="profile-posts-title">Посты</div>
      <div class="feed" id="userProfileFeed"></div>
    </section>
  </main>
</div>

<!-- Меню профиля (3 точки) -->
<div class="profile-menu-backdrop" id="profileMenuBackdrop">
  <div class="profile-menu" id="profileMenu">
    <button class="profile-menu-item" data-pm="notifs"><span>🔔</span> Уведомления<span id="menuNotifBadge" style="margin-left:auto;background:var(--dgr);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:none;align-items:center;justify-content:center"></span></button>
    <button class="profile-menu-item" data-pm="settings"><span>⚙️</span> Настройки</button>
    <button class="profile-menu-item" data-pm="admin" id="profileMenuAdmin" style="display:none"><span>🛡️</span> Админ-панель</button>
    <button class="profile-menu-item" data-pm="theme"><span>🎨</span> Тема</button>
    <button class="profile-menu-item" data-pm="about"><span>ℹ️</span> О компании</button>
    <button class="profile-menu-item" data-pm="logout"><span>🚪</span> Выйти</button>
  </div>
</div>

<!-- Баннер уведомлений -->
<div class="notif-banner" id="notifBanner" onclick="this.classList.remove('show')">
  <div class="notif-banner-title" id="notifBannerTitle">Уведомление</div>
  <div class="notif-banner-text" id="notifBannerText"></div>
</div>

<!-- Модалка -->
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

<!-- Тост (для бана и других сообщений) -->
<div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

function ago(ts){
  if(!ts)return'';
  const ms=ts.toMillis?ts.toMillis():ts;
  const d=Math.floor((Date.now()-ms)/1000);
  if(d<60)return'только что';
  if(d<3600)return Math.floor(d/60)+' мин';
  if(d<86400)return Math.floor(d/3600)+' ч';
  if(d<604800)return Math.floor(d/86400)+' д';
  return new Date(ms).toLocaleDateString('ru-RU');
}

function compressImage(file,maxSize=800,quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}
        else{if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('img load error'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('read error'));
    reader.readAsDataURL(file);
  });
}

function bindDropZone(el,input,onFile){
  if(!el||!input)return;
  el.addEventListener('click',()=>input.click());
  input.addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    if(!f.type.startsWith('image/'))return toast('Только изображение');
    try{await onFile(f)}catch(err){toast('Ошибка: '+err.message)}
    input.value='';
  });
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();el.classList.add('dragover')}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();el.classList.remove('dragover')}));
  el.addEventListener('drop',async e=>{
    const f=e.dataTransfer.files[0];if(!f)return;
    if(!f.type.startsWith('image/'))return toast('Только изображение');
    try{await onFile(f)}catch(err){toast('Ошибка: '+err.message)}
  });
}

/* Google Auth */
const gProvider=new GoogleAuthProvider();
async function googleAuth(){
  try{
    const cred=await signInWithPopup(auth,gProvider);
    const uid=cred.user.uid;
    const email=cred.user.email;
    const uref=doc(db,'users',uid);
    const snap=await getDoc(uref);
    
    if(snap.exists()){
      const d=snap.data();
      if(d.banned){ await showBannedScreen(d.banReason); return; }
      return; // Если не забанен, onAuthStateChanged сам подхватит
    }
    
    const eRef=doc(db,'emailAccounts',email);
    const eSnap=await getDoc(eRef);
    
    if(eSnap.exists()){
      const uids=eSnap.data().uids||[];
      let linked=false;
      for(const oldUid of uids){
        const oldRef=doc(db,'users',oldUid);
        const oldSnap=await getDoc(oldRef);
        if(oldSnap.exists()){
          const old=oldSnap.data();
          if(!old.banned){
            // Привязываем Google к старому аккаунту, чтобы не плодить дубликаты
            await updateDoc(oldRef,{email:cred.user.email,googleUid:uid});
            await updateDoc(uref,{uid,email:cred.user.email,realEmail:email,customCode:old.customCode,name:old.name,username:old.username,bio:old.bio,avatar:old.avatar,theme:old.theme,lang:old.lang,followers:old.followers||[],following:old.following||[],interests:old.interests||[],prefix:old.prefix||null,prefixColor:old.prefixColor||null,customTheme:old.customTheme||null,setupDone:true,banned:false,googleLinked:true,createdAt:serverTimestamp()});
            toast('Аккаунт привязан к Google');
            linked=true;
            break;
          }
        }
      }
      if(linked) return;
    }
    
    // Создание нового аккаунта через Google
    const randCode='g_'+Math.random().toString(36).slice(2,10);
    await setDoc(uref,{uid,email:cred.user.email,realEmail:email,customCode:randCode,name:cred.user.displayName||'',username:'',bio:'',avatar:'',theme:selTheme,lang:selLang,followers:[],following:[],interests:[],createdAt:serverTimestamp(),setupDone:false,banned:false,googleLinked:true});
    await setDoc(eRef,{email,uids:arrayUnion(uid)},{merge:true});
    
    cu={uid,email:cred.user.email,realEmail:email,customCode:randCode,name:cred.user.displayName||'',username:'',bio:'',avatar:'',theme:selTheme,lang:selLang,followers:[],following:[],interests:[],setupDone:false,banned:false};
    applyTheme(selTheme);
    showScreen('profileSetupScreen');
    if($('setupName')) $('setupName').value=cu.name||'';
    
  }catch(err){
    if(err.code==='auth/popup-closed-by-user')return;
    if(err.code==='auth/unauthorized-domain')return toast('Домен не авторизован в Firebase');
    toast('Ошибка Google: '+(err.code||err.message));
  }
}

$('registerBtn').onclick=async()=>{

  setErr('regEmail','regEmailError','');setErr('regPassword','regPasswordError','');setErr('regPassword2','regPassword2Error','');setErr('regCode','regCodeError','');
  
  if(!email)return setErr('regEmail','regEmailError','Введи email');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setErr('regEmail','regEmailError','Некорректный email');
  if(!pass||pass.length<6)return setErr('regPassword','regPasswordError','Минимум 6 символов');
  if(pass!==pass2)return setErr('regPassword2','regPassword2Error','Пароли не совпадают');
  if(!code)return setErr('regCode','regCodeError','Введи кастомный код');
  if(!/^[a-z0-9_]{3,30}$/.test(code))return setErr('regCode','regCodeError','3–30: латиница, цифры, _');
  
  $('registerBtn').disabled=true;$('registerBtn').textContent='Создание...';
  
  try{
    // Проверка уникальности кода
    const qs=await getDocs(query(collection(db,'users'),where('customCode','==',code)));
    if(!qs.empty){setErr('regCode','regCodeError','Этот код занят');$('registerBtn').disabled=false;$('registerBtn').textContent='Продолжить';return}
    
    // Проверка лимита на почту
    const eRef=doc(db,'emailAccounts',email);
    const eSnap=await getDoc(eRef);
    const uids=eSnap.exists()?(eSnap.data().uids||[]):[];
    
    let activeUid=null;
    for(const u of uids){
      const us=await getDoc(doc(db,'users',u));
      if(us.exists()&&!us.data().banned)activeUid=u;
    }
    
    if(activeUid){setErr('regEmail','regEmailError','На эту почту уже есть аккаунт');$('registerBtn').disabled=false;$('registerBtn').textContent='Продолжить';return}
    
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    
    const userData={uid:cred.user.uid,email,realEmail:email,customCode:code,name:'',username:'',bio:'',avatar:'',theme:selTheme,lang:selLang,followers:[],following:[],interests:[],createdAt:serverTimestamp(),setupDone:false,banned:false};
    
    await setDoc(doc(db,'users',cred.user.uid),userData);
    await setDoc(eRef,{email,uids:arrayUnion(cred.user.uid)},{merge:true});
    
    cu=userData;
    applyTheme(selTheme);
    showScreen('profileSetupScreen');
  }catch(err){
    const c=err.code||'';
    if(c==='auth/email-already-in-use')setErr('regEmail','regEmailError','Email уже используется');
    else if(c==='auth/weak-password')setErr('regPassword','regPasswordError','Слабый пароль');
    else if(c==='auth/invalid-email')setErr('regEmail','regEmailError','Некорректный email');
    else setErr('regPassword','regPasswordError','Ошибка: '+(err.message||c));
  }
  $('registerBtn').disabled=false;$('registerBtn').textContent='Продолжить';
};

$('authForm').onsubmit=async e=>{
  e.preventDefault();
  const email=$('emailInput').value.trim().toLowerCase(),pass=$('passwordInput').value,code=$('codeInput').value.trim().toLowerCase();
  setErr('emailInput','emailError','');setErr('passwordInput','passwordError','');setErr('codeInput','codeError','');
  
  if(!email)return setErr('emailInput','emailError','Введи email');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setErr('emailInput','emailError','Некорректный email');
  if(!pass)return setErr('passwordInput','passwordError','Введи пароль');
  if(!code)return setErr('codeInput','codeError','Введи кастомный код');
  
  $('loginBtn').disabled=true;$('loginBtn').textContent='Вход...';
  
  try{
    const qs=await getDocs(query(collection(db,'users'),where('customCode','==',code)));
    if(qs.empty){setErr('codeInput','codeError','Неверный кастомный код');throw new Error('c')}
    
    const ud=qs.docs[0].data();
    if(ud.banned){ await showBannedScreen(ud.banReason); throw new Error('b'); }
    
    if(ud.realEmail!==email){setErr('emailInput','emailError','Email не совпадает с кодом');throw new Error('e')}
    
    try{await signInWithEmailAndPassword(auth,ud.email,pass)}
    catch(err){
      if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')setErr('passwordInput','passwordError','Неверный пароль');
      else setErr('passwordInput','passwordError','Ошибка входа');
      throw err;
    }
  }catch(err){
    if(err.message!=='c'&&err.message!=='e'&&err.message!=='b'&&!err.code){
      setErr('passwordInput','passwordError','Не удалось войти');
    }
  }
  $('loginBtn').disabled=false;$('loginBtn').textContent='Войти';
};

/* Слушатель авторизации */
onAuthStateChanged(auth,async user=>{
  $('loader').classList.add('hidden');
  if(!user){
    cu=null;
    if(unsubPosts){unsubPosts();unsubPosts=null}
    if(unsubUsers){unsubUsers();unsubUsers=null}
    if(unsubChats){unsubChats();unsubChats=null}
    if(unsubAds){unsubAds();unsubAds=null}
    if(unsubNotifs){unsubNotifs();unsubNotifs=null}
    if(unsubStories){unsubStories();unsubStories=null}
    
    $('appScreen').classList.remove('active');$('profileSetupScreen').classList.add('hidden');
    showScreen('authScreen');$('authForm').style.display='block';$('regForm').style.display='none';
    $('authSubtitle').textContent='Войди в свой аккаунт';return;
  }
  
  let snap;
  try{snap=await getDoc(doc(db,'users',user.uid))}catch(err){toast('Ошибка сети');return}
  
  if(snap.exists()){
    const d=snap.data();
    if(d.banned){ await showBannedScreen(d.banReason); return; }
    cu={uid:user.uid,...d};
  }else{
    // На случай, если юзера нет в базе (например, старый аккаунт)
    return;
  }
  
  applyTheme(cu.theme||'light');
  if(cu.customTheme && typeof applyCustomTheme==='function')applyCustomTheme(cu.customTheme);
  if(localStorage.getItem('nexo_admin')==='1')isAdmin=true;
  
  if(!cu.setupDone||!cu.username){showScreen('profileSetupScreen');$('setupName').value=cu.name||'';return}
  
  await startApp();
});

function isOnline(u){
  if(!u||!u.lastSeen)return false;
  const ms=u.lastSeen.toMillis?u.lastSeen.toMillis():u.lastSeen;
  return Date.now()-ms < 60000;
}

/* Главный запуск */
async function startApp(){
  showScreen('app');
  $('loader').classList.add('hidden');
  
  if(unsubUsers)unsubUsers();
  unsubUsers=onSnapshot(collection(db,'users'),snap=>{
    usersCache={};
    snap.forEach(d=>{usersCache[d.id]={uid:d.id,...d.data()}});
    renderFeed();renderProf();
    if($('screenSearch').classList.contains('active'))renderSearch();
    if($('screenChats').classList.contains('active'))renderChatList();
    if(currentUserId)renderUserProfile(currentUserId);
    updateNotifBadge();
    updateProfileMenu();
  });
  
  if(unsubPosts)unsubPosts();
  unsubPosts=onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),snap=>{
    postsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderFeed();renderProf();
    if(currentUserId)renderUserProfile(currentUserId);
  },err=>{console.error('posts',err)});
  
  if(unsubAds)unsubAds();
  unsubAds=onSnapshot(collection(db,'ads'),snap=>{
    adsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderFeed();
  },err=>{});
  
  refreshTop();
  switchScr('feed');
  updateProfileMenu();
  requestNotifPerm();
  startPresence();
  
  // Запуск уведомлений и сторис (будут в следующих частях)
  if(typeof initNotifs==='function') initNotifs();
  if(typeof loadStories==='function') loadStories();
}

  else if(n==='search'){
    $('screenSearch').classList.add('active');
    $('tabSearch').classList.add('active');

  else if(n==='chats'){
    $('screenChats').classList.add('active');

    closeChatView();
    renderChatList();
  }
  else if(n==='notifs'){

  else if(n==='profile'){
    $('screenProfile').classList.add('active');

  else if(n==='user'){

/* ============ УВЕДОМЛЕНИЯ ============ */
let lastNotifIds = new Set();

function updateNotifBadge(){
  const badge=$('menuNotifBadge');
  if(!badge)return;
  const unread=notifsCache.filter(n=>!n.read).length;
  if(unread>0){
    badge.textContent=unread>9?'9+':unread;
    badge.style.display='flex';
  }else{
    badge.style.display='none';
  }
}

function initNotifs(){
  if(unsubNotifs)unsubNotifs();
  const q=query(collection(db,'notifications'),where('to','==',cu.uid));
  
  unsubNotifs=onSnapshot(q,snap=>{
    notifsCache=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
      const ta=a.createdAt?.toMillis?a.createdAt.toMillis():0;
      const tb=b.createdAt?.toMillis?b.createdAt.toMillis():0;
      return tb-ta;
    });
    
    // Показываем пуш для новых
    snap.docs.forEach(d=>{
      if(lastNotifIds.has(d.id))return;
      lastNotifIds.add(d.id);
      const n=d.data();
      if(!n.read && n.from!==cu.uid){
        pushNotify(n.title||'Уведомление', n.text||'');
      }
    });
    
    updateNotifBadge();
    if($('screenNotifs').classList.contains('active'))renderNotifs();
  },err=>{console.error('notifs',err)});
}

async function sendNotif(to,type,title,text,extra={}){
  try{
    await addDoc(collection(db,'notifications'),{
      to,from:cu.uid,type,title,text,read:false,status:'pending',createdAt:serverTimestamp(),...extra
    });
  }catch(err){console.error(err)}
}

function renderNotifs(){
  const box=$('notifList');
  if(!box)return;
  
  if(!notifsCache.length){
    box.innerHTML=`<div class="empty" style="padding:60px 20px"><div class="empty-title">Уведомлений нет</div><div class="empty-text">Пока всё тихо</div></div>`;
    return;
  }
  
  box.innerHTML=notifsCache.map(n=>{
    const from=usersCache[n.from]||{name:'Система',username:'system'};
    const isCo=n.type==='coauthor_request';
    const isGr=n.type==='group_invite';
    
    return `<div class="notif-item ${n.read?'':'unread'}" data-notif="${n.id}">
      ${avHTML(from,'sm')}
      <div class="notif-item-body">
        <div class="notif-item-title">${esc(n.title||'Уведомление')}</div>
        <div class="notif-item-text">${esc(n.text||'')}</div>
        <div class="notif-item-time">${ago(n.createdAt)}</div>
        ${(isCo||isGr)&&n.status==='pending'?`<div class="notif-actions"><button class="notif-accept" data-acc="${n.id}">Принять</button><button class="notif-decline" data-dec="${n.id}">Отклонить</button></div>`:''}
        ${n.status==='accepted'?`<div style="font-size:12px;color:var(--rp);margin-top:6px">✓ Принято</div>`:''}
        ${n.status==='declined'?`<div style="font-size:12px;color:var(--dgr);margin-top:6px">✕ Отклонено</div>`:''}
      </div>
    </div>`;
  }).join('');
  
  // Отметка "прочитано" при клике
  box.querySelectorAll('[data-notif]').forEach(el=>el.onclick=async e=>{
    if(e.target.closest('[data-acc]')||e.target.closest('[data-dec]'))return;
    const nid=el.dataset.notif;
    const n=notifsCache.find(x=>x.id===nid);
    if(!n||n.read)return;
    await updateDoc(doc(db,'notifications',nid),{read:true});
  });
  
  // Принятие (Соавтор или Группа)
  box.querySelectorAll('[data-acc]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const nid=b.dataset.acc;
    const n=notifsCache.find(x=>x.id===nid);
    if(!n)return;
    
    if(n.type==='coauthor_request'){
      const post=postsCache.find(p=>p.id===n.postId);
      if(post){
        const list=post.coauthors||[];
        if(!list.includes(n.from))list.push(n.from);
        await updateDoc(doc(db,'posts',post.id),{coauthors:list});
      }
    }
    if(n.type==='group_invite'){
      await updateDoc(doc(db,'chats',n.chatId),{users:arrayUnion(cu.uid)});
    }
    
    await updateDoc(doc(db,'notifications',nid),{status:'accepted',read:true});
    toast('Принято');
  });
  
  // Отклонение
  box.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    await updateDoc(doc(db,'notifications',b.dataset.dec),{status:'declined',read:true});
    toast('Отклонено');
  });
}
/* ============ ЛЕНТА И ПОСТЫ ============ */
function renderFeed(){
  const f=$('feed');
  if(!f)return;
  f.innerHTML=postsCache.length?buildSmartFeed():emptyState();
}

function renderProf(){
  if(!cu)return;
  fillAv($('profileAvatar'),cu);
  $('profileName').textContent=cu.name;
  $('profileHandle').textContent='@'+cu.username;
  const b=$('profileBio');
  if(cu.bio&&cu.bio.trim()){
    b.textContent=cu.bio;
    b.classList.remove('empty');
  }else{
    b.textContent='Описание пока нет';
    b.classList.add('empty');
  }
  const mine=postsCache.filter(p=>p.authorId===cu.uid);
  $('statPosts').textContent=mine.length;
  $('statFollowers').textContent=(cu.followers||[]).length;
  $('statFollowing').textContent=(cu.following||[]).length;
  $('profileFeed').innerHTML=mine.length?mine.map(p=>postHTML(p,true)).join(''):`<div class="empty" style="padding:40px 20px"><div class="empty-title">Здесь пока нет постов</div><div class="empty-text">Нажми «Опубликовать пост»</div></div>`;
}

const emptyState=()=>`<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="empty-title">Пока пусто</div><div class="empty-text">Стань первым, кто что-нибудь напишет</div></div>`;

function scorePost(p){
  const interests=getUserInterests();
  if(!p.tags||!p.tags.length)return 0;
  let s=0;
  p.tags.forEach(t=>{if(interests[t])s+=interests[t]});
  return s;
}

function buildSmartFeed(){
  const visible=postsCache.filter(p=>{
    if(p.pending&&p.authorId!==cu.uid&&!isAdmin)return false;
    if((cu.blocked||[]).includes(p.authorId))return false;
    const a=usersCache[p.authorId];
    if(a&&a.banned)return false;
    return true;
  });
  
  const scored=visible.map(p=>({p,score:scorePost(p),ts:p.createdAt?.toMillis?p.createdAt.toMillis():p.createdAt||0}));
  scored.sort((a,b)=>{if(b.score!==a.score)return b.score-a.score;return b.ts-a.ts});
  
  let html='',adCount=0;
  scored.forEach((item,i)=>{
    html+=postHTML(item.p);
    if((i+1)%10===0&&adsCache.length){
      const matched=adsCache.filter(ad=>{
        if(!ad.keywords||!ad.keywords.length)return true;
        const int=getUserInterests();
        return ad.keywords.some(k=>int[k.toLowerCase()]);
      });
      const pool=matched.length?matched:adsCache;
      html+=adHTML(pool[adCount%pool.length]);
      adCount++;
    }
  });
  return html||emptyState();
}

function adHTML(a){
  const img=a.image?`<div class="post-img"><img src="${a.image}" alt=""></div>`:'';
  const linkHTML=a.link?`<div style="margin-top:8px"><a href="${esc(a.link)}" target="_blank" style="color:var(--acc);font-weight:600;font-size:13.5px;text-decoration:none">Перейти →</a></div>`:'';
  return `<article class="post ad"><div class="post-main"><div class="avatar" style="background:var(--acc);color:var(--acct);font-size:13px;font-weight:800">AD</div><div class="post-body"><div class="post-head"><span class="ad-badge">Реклама</span><span class="post-time">· продвигается</span></div><div class="post-text" style="font-weight:700;font-size:15.5px;margin-bottom:6px">${esc(a.title||'Реклама')}</div>${img}${a.text?`<div class="post-text">${esc(a.text)}</div>`:''}${linkHTML}</div></div></article>`;
}

function linkifyHashtags(text){
  return esc(text).replace(/#([\wа-яёА-ЯЁ_]{2,30})/g,'<span class="hashtag" data-tag="$1">#$1</span>');
}

const POST_EMOJIS=['❤️','😂','🔥','😮','😢','👍'];
function pollHTML(p){
  if(!p.poll)return'';
  const poll=p.poll,votes=poll.votes||{},total=Object.keys(votes).length,myVote=votes[cu.uid];
  const opts=poll.options.map((opt,i)=>{
    const cnt=Object.values(votes).filter(v=>v===i).length;
    const pct=total?Math.round(cnt/total*100):0;
    return `<div class="poll-opt ${myVote===i?'voted':''}" data-action="poll-vote" data-opt="${i}"><div class="poll-fill" style="width:${total?pct:0}%"></div><div class="poll-label"><span>${esc(opt)}</span>${total?`<span>${pct}%</span>`:''}</div></div>`;
  }).join('');
  return `<div class="poll-box"><div class="poll-q">${esc(poll.question)}</div>${opts}<div class="poll-total">Всего: ${total}</div></div>`;
}

function mediaGridHTML(p){
  if(p.images&&p.images.length){
    const n=Math.min(p.images.length,4);
    const cls=n===1?'c1':n===2?'c2':n===3?'c3':'c4';
    return `<div class="post-media-grid ${cls}">${p.images.slice(0,4).map(src=>`<div class="pm"><img src="${src}"></div>`).join('')}</div>`;
  }
  if(p.image)return `<div class="post-img"><img src="${p.image}" alt=""></div>`;
  return '';
}

function postHTML(p){
  const isMe=p.authorId===cu.uid,liked=(p.likes||[]).includes(cu.uid),repost=(p.reposts||[]).includes(cu.uid);
  const a=usersCache[p.authorId]||{uid:p.authorId,name:p.authorName,username:p.authorUsername,avatar:p.authorAvatar};
  const prefixHTML=a.prefix?`<span class="prefix-badge" style="background:${esc(a.prefixColor||'#b06bff')}">${esc(a.prefix)}</span>`:'';
  const isOnlineUser=isOnline(a)?'<span class="online-dot"></span>':'';
  const verif=a.verified?'<span class="verified">✓</span>':'';
  const eStatus=a.emojiStatus?`<span class="emoji-status">${a.emojiStatus}</span>`:'';
  const fw=!isMe&&(cu.following||[]).includes(p.authorId);
  const fb=isMe?'':`<button class="btn-follow ${fw?'following':''}" data-action="follow" data-author="${esc(p.authorId)}">${fw?'Отписаться':'Подписаться'}</button>`;
  const coHTML=(p.coauthors&&p.coauthors.length)?`<div class="post-coauthor">👥 Совместно с ${p.coauthors.map(uid=>{const u=usersCache[uid];return u?`<b>@${esc(u.username)}</b>`:'<b>?</b>'}).join(', ')}</div>`:'';
  const editBtn=isMe?`<button class="action-btn" data-action="edit-post" style="color:var(--acc)">✏️</button>`:'';
  const delBtn=(isMe||isAdmin)?`<button class="action-btn" data-action="del-post" style="color:var(--dgr)">🗑️</button>`:'';
  const reportBtn=!isMe?`<button class="action-btn" data-action="report-post" style="color:var(--muted)">🚩</button>`:'';
  const pendingCls=(p.pending&&(isMe||isAdmin))?' pending':'';
  
  const reactBar=POST_EMOJIS.map(e=>{
    const cnt=((p.reactions||{})[e]||[]).length;
    const act=((p.reactions||{})[e]||[]).includes(cu.uid)?'active':'';
    return `<button class="react-btn ${act}" data-action="react" data-emoji="${e}">${e}${cnt?' '+cnt:''}</button>`;
  }).join('');

  return `<article class="post${pendingCls}" data-post="${p.id}">
    <div class="post-main">
      <div class="post-avatar-click" data-action="open-user" data-author="${esc(p.authorId)}" style="position:relative">
        ${avHTML(a)}${isOnlineUser}
      </div>
      <div class="post-body">
        <div class="post-head">
          ${prefixHTML}
          <span class="post-name post-name-click" data-action="open-user" data-author="${esc(p.authorId)}">${esc(a.name||'Без имени')}${verif}</span>
          ${eStatus}
          <span class="post-handle">@${esc(a.username||'anon')}</span><span class="post-dot">·</span><span class="post-time">${ago(p.createdAt)}</span>
        </div>
        ${coHTML}
        ${p.text?`<div class="post-text">${linkifyHashtags(p.text)}</div>`:''}
        ${mediaGridHTML(p)}
        ${pollHTML(p)}
      </div>
      ${fb}
    </div>
    
    <div class="post-reactions">${reactBar}</div>
    
    <div class="post-actions">
      <button class="action-btn ${liked?'liked':''}" data-action="like">
        <svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>${(p.likes||[]).length||''}</span>
      </button>
      <button class="action-btn" data-action="comments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${p.commentsCount||''}</span>
      </button>
      <button class="action-btn ${repost?'reposted':''}" data-action="repost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>${(p.reposts||[]).length||''}</span>
      </button>
      ${editBtn}${delBtn}${reportBtn}
    </div>
    <div class="comments">
      <div class="comments-list"></div>
      <form class="comment-form" data-action="comment-form"><input type="text" placeholder="Написать комментарий..." maxlength="300" autocomplete="off"><button type="submit">Отправить</button></form>
    </div>
  </article>`;
}
/* ============ КЛИКИ В ЛЕНТЕ ============ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');
  if(!b)return;
  const act=b.dataset.action;
  
  if(act==='open-user'){
    const tid=b.dataset.author;
    if(tid===cu.uid){switchScr('profile');return}
    openUserProfile(tid);return;
  }
  
  const pe=b.closest('[data-post]');
  if(!pe)return;
  const p=postsCache.find(x=>x.id===pe.dataset.post);
  if(!p)return;
  
  if(act==='like'){
    const l=(p.likes||[]).includes(cu.uid);
    try{
      await updateDoc(doc(db,'posts',p.id),{likes:l?arrayRemove(cu.uid):arrayUnion(cu.uid)});
      if(!l)addInterests(p.tags);
    }catch(err){toast(err.message)}
  }
  else if(act==='repost'){
    if(p.authorId===cu.uid)return toast('Нельзя репостить свой пост');
    const r=(p.reposts||[]).includes(cu.uid);
    try{
      await updateDoc(doc(db,'posts',p.id),{reposts:r?arrayRemove(cu.uid):arrayUnion(cu.uid)});
      toast(r?'Репост отменён':'Репост сделан');
    }catch(err){toast(err.message)}
  }
  else if(act==='comments'){
    const c=pe.querySelector('.comments');
    c.classList.toggle('open');
    if(c.classList.contains('open')){
      await loadComments(p.id,c.querySelector('.comments-list'));
      const i=c.querySelector('input');
      if(i)setTimeout(()=>i.focus(),50);
    }
  }
  else if(act==='follow'){
    const tid=b.dataset.author,fl=(cu.following||[]).includes(tid);
    try{
      if(fl){
        await updateDoc(doc(db,'users',cu.uid),{following:arrayRemove(tid)});
        await updateDoc(doc(db,'users',tid),{followers:arrayRemove(cu.uid)});
        cu.following=(cu.following||[]).filter(x=>x!==tid);
        toast('Вы отписались');
      }else{
        await updateDoc(doc(db,'users',cu.uid),{following:arrayUnion(tid)});
        await updateDoc(doc(db,'users',tid),{followers:arrayUnion(cu.uid)});
        cu.following=[...(cu.following||[]),tid];
        toast('Вы подписались');
      }
      const fr=await getDoc(doc(db,'users',cu.uid));
      if(fr.exists())cu={uid:cu.uid,...fr.data()};
      renderFeed();renderProf();renderSearch();
    }catch(err){toast(err.message)}
  }
  else if(act==='message'){const tid=b.dataset.author;await openOrCreateChat(tid)}
  else if(act==='edit-post'){openEditPost(p)}
  else if(act==='del-post'){
    if(p.authorId!==cu.uid&&!isAdmin)return toast('Это чужой пост');
    if(!confirm('Удалить?'))return;
    try{await deleteDoc(doc(db,'posts',p.id));toast('Удалён')}catch(err){toast(err.message)}
  }
  else if(act==='report-post'){
    openReportModal(p);
  }
  else if(act==='react'){
    e.stopPropagation();
    const emoji=b.dataset.emoji;
    const reactions={...(p.reactions||{})};
    for(const k in reactions){
      if(k!==emoji&&reactions[k].includes(cu.uid)){
        reactions[k]=reactions[k].filter(u=>u!==cu.uid);
      }
    }
    if(!reactions[emoji])reactions[emoji]=[];
    const idx=reactions[emoji].indexOf(cu.uid);
    if(idx>=0)reactions[emoji].splice(idx,1);
    else reactions[emoji].push(cu.uid);
    try{
      await updateDoc(doc(db,'posts',p.id),{reactions});
    }catch(err){toast(err.message)}
  }
  else if(act==='poll-vote'){
    e.stopPropagation();
    if(!p.poll)return;
    const idx=+b.dataset.opt;
    const votes={...(p.poll.votes||{})};
    votes[cu.uid]=idx;
    try{await updateDoc(doc(db,'posts',p.id),{'poll.votes':votes})}catch(err){toast(err.message)}
  }
});

/* Добавление интересов */
async function addInterests(tags){
  if(!tags||!tags.length)return;
  const cur=cu.interests||[];
  const merged=[...new Set([...cur,...tags])].slice(-50);
  cu.interests=merged;
  try{await updateDoc(doc(db,'users',cu.uid),{interests:merged})}catch{}
}

/* Жалоба на пост */
function openReportModal(p){
  openModal(`<div class="modal-head"><div class="modal-title">Пожаловаться</div><button class="modal-close">×</button></div><div class="modal-body">
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">Выбери причину:</p>
    <button class="profile-menu-item" data-reason="Спам или реклама"><span>📢</span> Спам или реклама</button>
    <button class="profile-menu-item" data-reason="Оскорбления"><span>😡</span> Оскорбления</button>
    <button class="profile-menu-item" data-reason="Незаконный контент"><span>⚠️</span> Незаконный контент</button>
    <button class="profile-menu-item" data-reason="Порнография"><span>🔞</span> Порнография</button>
    <button class="profile-menu-item" data-reason="Другое"><span>❓</span> Другое</button>
  </div>`);
  $('modal').querySelectorAll('[data-reason]').forEach(btn=>btn.onclick=async()=>{
    const reason=btn.dataset.reason;
    try{
      await addDoc(collection(db,'reports'),{postId:p.id,postAuthor:p.authorId,from:cu.uid,reason,createdAt:serverTimestamp(),status:'pending'});
      await updateDoc(doc(db,'posts',p.id),{pending:true,reportReason:reason});
      const admins=Object.values(usersCache).filter(u=>u.prefix);
      for(const a of admins){
        if(a.uid!==cu.uid)await sendNotif(a.uid,'report','🚩 Жалоба','@'+cu.username+': '+reason,{postId:p.id});
      }
      closeModal();toast('Жалоба отправлена');
    }catch(err){toast('Ошибка: '+err.message)}
  });
}

/* Комментарии */
async function loadComments(postId,container){
  try{
    const snap=await getDocs(query(collection(db,'posts',postId,'comments'),orderBy('createdAt','asc')));
    if(snap.empty){container.innerHTML=`<div class="comments-empty">Комментариев пока нет</div>`;return}
    container.innerHTML=snap.docs.map(d=>{
      const c=d.data(),u=usersCache[c.authorId]||{name:c.authorName,username:c.authorUsername,avatar:c.authorAvatar};
      return `<div class="comment">${avHTML(u,'sm')}<div class="comment-body"><div class="comment-head"><span class="comment-name">${esc(u.name)}</span><span class="comment-handle">@${esc(u.username)}</span><span class="comment-time">· ${ago(c.createdAt)}</span></div><div class="comment-text">${esc(c.text)}</div></div></div>`;
    }).join('');
  }catch{container.innerHTML=`<div class="comments-empty">Ошибка загрузки</div>`}
}

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-action="comment-form"]');
  if(!f)return;
  e.preventDefault();
  const pe=f.closest('[data-post]'),p=postsCache.find(x=>x.id===pe.dataset.post);
  if(!p)return;
  const i=f.querySelector('input'),t=i.value.trim();
  if(!t)return;
  i.value='';
  try{
    await addDoc(collection(db,'posts',p.id,'comments'),{authorId:cu.uid,authorName:cu.name,authorUsername:cu.username,authorAvatar:cu.avatar||'',text:t,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'posts',p.id),{commentsCount:increment(1)});
    addInterests(p.tags);
    await loadComments(p.id,pe.querySelector('.comments-list'));
  }catch(err){toast('Ошибка: '+err.message)}
});
/* ============ КОМПОЗЕР (СОЗДАНИЕ ПОСТА) ============ */
$('openPublishBtn').onclick=()=>{
  postImagesData=[]; postCoauthors=[];
  openModal(`<div class="modal-head"><div class="modal-title">Новый пост</div><button class="modal-close">×</button></div><div class="modal-body">
    <form id="pubForm" novalidate>

function renderUserProfile(uid){
  const u=usersCache[uid];
  if(!u){
    $('userProfileHeader').innerHTML=`<div class="user-profile-header"><div class="back-row"><button class="back-btn" id="backFromUser">← Назад</button></div><div class="empty-text">Пользователь не найден</div></div>`;
    $('userProfileFeed').innerHTML=''; bindBack(); return;
  }
  
  const f=(cu.following||[]).includes(uid);
  const isMe=uid===cu.uid;
  const prefixHTML=u.prefix?`<span class="prefix-badge" style="background:${esc(u.prefixColor||'#b06bff')}">${esc(u.prefix)}</span>`:'';
  const verif=u.verified?'<span class="verified">✓</span>':'';
  const blocked=(cu.blocked||[]).includes(uid);

  $('userProfileHeader').innerHTML=`
    <div class="user-profile-header">
      <div class="back-row"><button class="back-btn" id="backFromUser">← Назад</button></div>
      <div class="profile-top">
        <div class="avatar lg">${u.avatar?`<img src="${u.avatar}" alt="">`:esc(ini(u.name))}</div>
        <div class="profile-info">
          <div class="profile-name">${prefixHTML}${esc(u.name||'Без имени')}${verif}</div>
          <div class="profile-handle">@${esc(u.username)}</div>
          <div class="profile-bio ${u.bio?'':'empty'}">${u.bio?esc(u.bio):'Описание пока нет'}</div>
        </div>
      </div>
      <div class="profile-actions">
        ${isMe?'':`<button class="btn-follow ${f?'following':''}" id="userFollowBtn">${f?'Отписаться':'Подписаться'}</button>${f?`<button class="btn-publish" id="userMsgBtn">💬 Написать</button>`:''}
        <button class="${blocked?'unblock-btn':'block-btn'}" id="userBlockBtn">${blocked?'Разблокировать':'Заблокировать'}</button>`}
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-num">${postsCache.filter(p=>p.authorId===uid&&(!p.pending||isAdmin||isMe)).length}</span><span class="stat-label">Постов</span></div>
        <div class="stat"><span class="stat-num">${(u.followers||[]).length}</span><span class="stat-label">Подписчиков</span></div>
        <div class="stat"><span class="stat-num">${(u.following||[]).length}</span><span class="stat-label">Подписок</span></div>
      </div>
    </div>`;
    
  const mine=postsCache.filter(p=>p.authorId===uid&&(!p.pending||isAdmin||isMe));
  $('userProfileFeed').innerHTML=mine.length?mine.map(p=>postHTML(p,false)).join(''):`<div class="empty" style="padding:40px 20px"><div class="empty-text">Постов пока нет</div></div>`;
  bindBack();

  const fb=$('userFollowBtn');
  if(fb)fb.onclick=async()=>{
    const fl=(cu.following||[]).includes(uid);
    try{
      if(fl){
        await updateDoc(doc(db,'users',cu.uid),{following:arrayRemove(uid)});
        await updateDoc(doc(db,'users',uid),{followers:arrayRemove(cu.uid)});
        cu.following=(cu.following||[]).filter(x=>x!==uid); toast('Отписались');
      }else{
        await updateDoc(doc(db,'users',cu.uid),{following:arrayUnion(uid)});
        await updateDoc(doc(db,'users',uid),{followers:arrayUnion(cu.uid)});
        cu.following=[...(cu.following||[]),uid]; toast('Подписались');
      }
      const fr=await getDoc(doc(db,'users',cu.uid)); if(fr.exists())cu={uid:cu.uid,...fr.data()};
      renderUserProfile(uid); renderFeed(); renderProf();
    }catch(err){toast(err.message)}
  };

  const mb=$('userMsgBtn');
  if(mb)mb.onclick=()=>openOrCreateChat(uid);

  const bb=$('userBlockBtn');
  if(bb)bb.onclick=async()=>{
    const list=cu.blocked||[];
    const i=list.indexOf(uid);
    if(i>=0)list.splice(i,1); else list.push(uid);
    cu.blocked=list;
    try{await updateDoc(doc(db,'users',cu.uid),{blocked:list}); toast(i>=0?'Разблокирован':'Заблокирован'); renderUserProfile(uid); renderFeed()}catch(err){toast(err.message)}
  };
