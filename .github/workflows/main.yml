
name: Nexo Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Sync Android project
        run: |
          npx cap sync android

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          test -s "$RUNNER_TEMP/nexo-release.jks"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          s = p.read_text()

          if "signingConfigs.release" in s:
              print("Release signing config already exists")
          else:
              pattern = r'android\s*\{'
              replacement = '''android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit("ERROR: Could not configure Android signing")

          release = re.search(r'release\s*\{', s)
          if not release:
              raise SystemExit("ERROR: release build type not found")

          start = release.end()
          s = s[:start] + '\n            signingConfig signingConfigs.release\n' + s[start:]

          p.write_text(s)
          PY
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
