
name: Build Nexo Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor 7
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 --no-audit --no-fund

      - name: Prepare HTML
        run: |
          test -f index.html
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexo.app",
            "appName": "Nexo",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          test -s "$RUNNER_TEMP/nexo-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/nexo-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Gradle signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          s = p.read_text()

          def matching_brace(text, opening):
              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("ERROR: Unclosed Gradle block")

          def locate_block(text, pattern, start=0, end=None):
              if end is None:
                  end = len(text)
              m = re.search(pattern, text[start:end])
              if not m:
                  return None
              block_start = start + m.start()
              opening = text.find("{", block_start, end)
              if opening < 0:
                  raise SystemExit("ERROR: Opening brace not found")
              closing = matching_brace(text, opening)
              return block_start, opening, closing

          android = locate_block(s, r'\bandroid\s*\{')
          if android is None:
              raise SystemExit("ERROR: android block not found")

          _, android_open, android_end = android

          signing = locate_block(
              s, r'\bsigningConfigs\s*\{', android_open, android_end + 1
          )

          if signing is None:
              signing_text = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          """
              s = s[:android_open + 1] + signing_text + s[android_open + 1:]

          android = locate_block(s, r'\bandroid\s*\{')
          _, android_open, android_end = android

          build_types = locate_block(
              s, r'\bbuildTypes\s*\{', android_open, android_end + 1
          )
          if build_types is None:
              raise SystemExit("ERROR: buildTypes block not found in android block")

          _, bt_open, bt_end = build_types
          release = locate_block(
              s, r'\brelease\s*\{', bt_open, bt_end + 1
          )
          if release is None:
              raise SystemExit("ERROR: release block not found in buildTypes")

          _, release_open, release_end = release
          body = s[release_open + 1:release_end]

          if not re.search(r'\bsigningConfig\s+signingConfigs\.release\b', body):
              s = (
                  s[:release_open + 1]
                  + "\n                signingConfig signingConfigs.release\n"
                  + s[release_open + 1:]
              )

          p.write_text(s)
          print("Release signing configured successfully")
          PY

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          set -eu
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
