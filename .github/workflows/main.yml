
name: Build Nexo Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor 7
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 --no-audit --no-fund

      - name: Prepare HTML
        run: |
          test -f index.html
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexo.app",
            "appName": "Nexo",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          test -s "$RUNNER_TEMP/nexo-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/nexo-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      
      - name: Configure Gradle signing
          env:
            KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks
          run: |
            python3 - <<'PY'
            from pathlib import Path
            import re

            p = Path("android/app/build.gradle")
            if not p.exists():
                raise SystemExit("ERROR: android/app/build.gradle not found")

            s = p.read_text()

            def find_block(text, pattern):
                m = re.search(pattern, text)
                if not m:
                    raise SystemExit("ERROR: Gradle block not found: " + pattern)
                opening = text.find("{", m.start())
                depth = 0
                for i in range(opening, len(text)):
                    if text[i] == "{":
                        depth += 1
                    elif text[i] == "}":
                        depth -= 1
                        if depth == 0:
                            return m.start(), opening, i
                raise SystemExit("ERROR: Unclosed Gradle block")

            if not re.search(r'\bsigningConfigs\s*\{', s):
                _, android_open, _ = find_block(s, r'\bandroid\s*\{')
                signing = """
                signingConfigs {
                    release {
                        storeFile file(System.getenv("KEYSTORE_PATH"))
                        storePassword System.getenv("KEYSTORE_PASSWORD")
                        keyAlias System.getenv("KEY_ALIAS")
                        keyPassword System.getenv("KEY_PASSWORD")
                    }
                }
            """
                s = s[:android_open + 1] + signing + s[android_open + 1:]

            bt_start, _, bt_end = find_block(s, r'\bbuildTypes\s*\{')
            release_match = re.search(
                r'\brelease\s*\{', s[bt_start:bt_end + 1]
            )
            if not release_match:
                raise SystemExit("ERROR: release build type not found")

            release_start = bt_start + release_match.start()
            _, release_open, release_end = find_block(
                s[release_start:], r'\brelease\s*\{'
            )
            release_open += release_start
            release_end += release_start

            release_body = s[release_open + 1:release_end]
            if not re.search(r'\bsigningConfig\s+signingConfigs\.release\b', release_body):
                s = (
                    s[:release_open + 1]
                    + "\n            signingConfig signingConfigs.release\n"
                    + s[release_open + 1:]
                )

            p.write_text(s)
            print("Release signing configured successfully")
            PY
            
      

      - name: Build signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/nexo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          set -eu
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
